/* Layout: sidebar gelap berisi navigasi + status, area kerja terang dengan judul halaman, kartu ringkasan berikon, lalu peta & tabel. */
:root{

  --accent:#0E7C6B; --accent-2:#0B6457; --accent-soft:#E2F3EF; --on-accent:#FFFFFF;
  --side:#0C211D; --side-2:#123029; --on-side:#D7E7E2; --side-muted:#8FA9A2;
  --ok:#15803D; --ok-bg:#E3F5EA; --warn:#B45309; --warn-bg:#FDF0DC; --bad:#C2321F; --bad-bg:#FCE7E3; --info:#2563EB; --info-bg:#E6EEFE;

  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1311; --surface:#121D1A; --sunk:#0E1816; --ink:#E5EEEB; --muted:#93A6A0; --line:#22302C;
  --accent:#3CC4A9; --accent-2:#5BD6BE; --accent-soft:#143A33; --on-accent:#04201A;
  --side:#07100E; --side-2:#0F1C19; --on-side:#D7E7E2; --side-muted:#7F9690;
  --ok:#6FD49F; --ok-bg:#15301F; --warn:#F2B866; --warn-bg:#3A2A12; --bad:#FF8A7E; --bad-bg:#3D1914; --info:#86A9FF; --info-bg:#18264A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono,td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--on-side);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
.brand b{display:block;font-size:15px;line-height:1.2;color:#fff;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--side-muted)}
.nav{display:grid;gap:2px}
.navlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:0 10px;margin:4px 0 2px}
.nav a{display:flex;align-items:center;gap:11px;color:var(--on-side);text-decoration:none;padding:9px 10px;border-radius:9px;font-weight:500;white-space:nowrap;opacity:.82}
.nav a:hover{background:var(--side-2);opacity:1}
.nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent);opacity:1;font-weight:600}
.nav a .lock{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--side-muted);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:10px;background:var(--side-2);border-radius:12px;padding:12px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--side-muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#6b7d78;display:inline-block}
.live.on i{background:#3FD68F;box-shadow:0 0 0 3px rgba(63,214,143,.22)}

main{min-width:0;padding:calc(22px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 48px 24px}
.wrap{max-width:1440px;margin:0 auto;display:grid;gap:18px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;max-width:1440px;margin:0 auto 18px}
.pagehead h1{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.pagehead p{margin:2px 0 0}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}

  .brand{padding:0}

  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}

/* ---------- komponen ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:15px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.in{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);min-width:0}
.in:focus{outline:2px solid var(--accent);border-color:transparent}
textarea.in{min-height:70px;width:100%}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.btn:hover{background:var(--sunk)}
.btn:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--sunk);color:var(--muted)} .pill.info{background:var(--info-bg);color:var(--info)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.kpi .kic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi .kic svg{width:21px;height:21px}
.kpi b{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi.ok .kic{background:var(--ok-bg);color:var(--ok)} .kpi.warn .kic{background:var(--warn-bg);color:var(--warn)}
.kpi.bad .kic{background:var(--bad-bg);color:var(--bad)} .kpi.info .kic{background:var(--info-bg);color:var(--info)}
.mon{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}

.map{height:470px;border-radius:12px;overflow:hidden;border:1px solid var(--line);z-index:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

.feed div:first-child{border-top:0}
.feed time{font-family:var(--mono);color:var(--accent);font-weight:500}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
tbody tr.click{cursor:pointer}
td.wrapcell{white-space:normal;min-width:160px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}

.modal{position:fixed;inset:0;z-index:1000;background:rgba(4,12,10,.55);display:flex;justify-content:flex-end}

<script type="text/plain" id="js-dash">
'use strict';
const CFG = window.APP_CONFIG || {};
const TZ = 'Asia/Jakarta';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fTgl = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'});
const fJam = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const fJamD = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const fWaktu = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const hariIni = () => fTgl.format(new Date());
const jam = iso => fJam.format(new Date(iso));
const fmtJarak = m => m == null ? '-' : m < 1000 ? Math.round(m) + ' m' : (m/1000).toLocaleString('id-ID', {maximumFractionDigits:2}) + ' km';
const kunci = n => String(n || '').trim().toLowerCase();
const WARNA = {aktif:'#2F6FED', pulang:'#8A9A95', Selesai:'#14714A', Pending:'#C27A00', Gagal:'#B42318'};
function pill(s){
  const c = ['Tepat Waktu','Selesai'].includes(s) ? 'ok' : ['Terlambat','Pulang Cepat','Pending'].includes(s) ? 'warn' : s === 'Gagal' ? 'bad' : 'idle';
  return `<span class="pill ${c}">${esc(s)}</span>`;
}
let toastT;
function toast(msg, kind = 'ok'){ const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + kind; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4500); }
function err(e){ toast((e && e.message) || String(e), 'bad'); }
function csv(nama, head, rows){
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const blob = new Blob(['﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const gmaps = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
function petaBaru(id){
  const m = L.map(id).setView([-6.9, 107.6], 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(m);
  return m;
}
const aksen = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0B5D51';

const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:false}});
const fotoUrl = p => sb.storage.from('foto').getPublicUrl(p).data.publicUrl;
const S = {lokasi:[], peng:null, teknisi:[], mon:null, lap:[], abs:[], maps:{}, titik:null};
const fmtM = v => Number(v || 0).toLocaleString('id-ID', {maximumFractionDigits:1});
function teksReport(x){
  return [`NAMA PELANGGAN : ${x.nama_pelanggan}`, `ID PELANGGAN : ${x.id_pelanggan}`, `SN ONT : ${x.sn_ont}`, `ODC : ${x.odc}`,
          `ODP : ${x.odp}`, `PORT : ${x.port}`, `PANJANG KABEL : ${fmtM(x.panjang_kabel)} m`, `TEKNISI : ${x.teknisi}`, `STASIUN : ${x.stasiun}`].join('\n');
}
$('#namaTim').textContent = CFG.NAMA_TIM || '';

const KIC = {"hadir": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 11l2 2 4-4\"/>", "telat": "<circle cx=\"12\" cy=\"13\" r=\"8\"/><path d=\"M12 9v4l2.5 2.5M9 2h6\"/>", "belum": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M17 9l4 4M21 9l-4 4\"/>", "pulang": "<path d=\"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3\"/>", "report": "<path d=\"M7 3h7l5 5v13H7z\"/><path d=\"M14 3v5h5M10 13h6M10 17h6\"/>", "kabel": "<path d=\"M4 4c8 0 4 16 16 16\"/><circle cx=\"4\" cy=\"4\" r=\"2\"/><circle cx=\"20\" cy=\"20\" r=\"2\"/>", "tek": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7\"/>"};
function kpi(v, l, c){
  const k = /hadir/i.test(l) ? 'hadir' : /terlambat/i.test(l) ? 'telat' : /belum/i.test(l) ? 'belum' : /pulang/i.test(l) ? 'pulang' : /kabel/i.test(l) ? 'kabel' : /^teknisi$/i.test(l) ? 'tek' : 'report';
  return `<div class="kpi ${c}"><div class="kic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${KIC[k]}</svg></div><b>${v}</b><span>${l}</span></div>`;
}
/* ---------------- navigasi ---------------- */
const PAGES = ['monitoring','laporan','absensi','lokasi','akun','pengaturan'];
window.addEventListener('hashchange', route);
function route(){
  const p = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'monitoring';
  document.querySelectorAll('#nav a').forEach(a => a.getAttribute('href') === '#' + p ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  PAGES.forEach(x => $('#p' + x[0].toUpperCase() + x.slice(1)).hidden = x !== p);
  $('#pgTitle').textContent = {monitoring:'Monitoring hari ini', laporan:'Report pekerjaan', absensi:'Rekap absensi', lokasi:'Lokasi & radius absen', akun:'Akun teknisi', pengaturan:'Pengaturan'}[p];
  $('#pgSub').textContent = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(new Date()) + (CFG.NAMA_TIM ? ' · ' + CFG.NAMA_TIM : '');
  ({monitoring:muatMonitoring, laporan:muatLaporan, absensi:muatAbsensi, lokasi:bukaLokasi, akun:bukaAkun, pengaturan:bukaPengaturan})[p]();
}
async function muatMaster(){
  const [l, g] = await Promise.all([sb.from('lokasi').select('*').order('nama'), sb.from('pengaturan').select('*').eq('id', 1).maybeSingle()]);
  if (l.error) throw l.error;
  S.lokasi = l.data; S.peng = g.data;
  const t = await sb.rpc('daftar_teknisi');
  if (!t.error) { S.teknisi = t.data.map(x => x.nama); isiPilihanTeknisi(S.teknisi); }
}
function isiPilihanTeknisi(names){
  ['#lTek', '#aTek'].forEach(s => {
    const v = $(s).value, semua = new Set([...names, ...[...$(s).options].map(o => o.value).filter(Boolean)]);
    $(s).innerHTML = '<option value="">Semua</option>' + [...semua].sort((a, b) => a.localeCompare(b)).map(n => `<option>${esc(n)}</option>`).join('');
    $(s).value = v;
  });
}

/* ---------------- realtime ---------------- */
let reloadT;
sb.channel('monitoring')
  .on('postgres_changes', {event:'INSERT', schema:'public', table:'absensi'}, p => notif(`${p.new.teknisi} absen ${p.new.tipe === 'MASUK' ? 'masuk' : 'pulang'} (${p.new.status})`))
  .on('postgres_changes', {event:'INSERT', schema:'public', table:'laporan'}, p => notif(`Report baru: ${p.new.teknisi} · ${p.new.nama_pelanggan} (${p.new.id_pelanggan})`))
  .subscribe(st => $('#live').classList.toggle('on', st === 'SUBSCRIBED'));
function notif(msg){
  toast(msg, 'info'); clearTimeout(reloadT);
  reloadT = setTimeout(() => {
    const p = location.hash.slice(1) || 'monitoring';
    if (p === 'monitoring' && $('#mTgl').value === hariIni()) muatMonitoring();
    if (p === 'laporan') muatLaporan();
    if (p === 'absensi') muatAbsensi();
  }, 800);
}

/* =====================================================================
   MONITORING
   ===================================================================== */
$('#mTgl').addEventListener('change', muatMonitoring);
$('#mHariIni').addEventListener('click', () => { $('#mTgl').value = hariIni(); muatMonitoring(); });
async function muatMonitoring(){
  const t = $('#mTgl').value || hariIni();
  try {
    const [a, r] = await Promise.all([
      sb.from('absensi').select('*').eq('tanggal', t),
      sb.from('laporan').select('id,teknisi,waktu,id_pelanggan,nama_pelanggan,odp,port,panjang_kabel,stasiun,lat,lng').eq('tanggal', t).order('waktu')
    ]);
    if (a.error) throw a.error; if (r.error) throw r.error;
    S.mon = {abs:a.data, lap:r.data}; renderMonitoring();
    $('#mUpd').textContent = 'Diperbarui ' + fJamD.format(new Date());
  } catch(e){ err(e); }
}
function renderMonitoring(){
  const {abs, lap} = S.mon;
  const masuk = abs.filter(x => x.tipe === 'MASUK'), pulang = abs.filter(x => x.tipe === 'PULANG');
  const hadir = new Set(masuk.map(x => kunci(x.teknisi)));
  const total = S.teknisi.length, belum = S.teknisi.filter(n => !hadir.has(kunci(n)));
  $('#mKpi').innerHTML = [[total ? `${hadir.size}/${total}` : hadir.size, 'Teknisi hadir', 'ok'], [masuk.filter(x => x.status === 'Terlambat').length, 'Terlambat', 'warn'],
    [belum.length, 'Belum absen', 'bad'], [pulang.length, 'Sudah pulang', ''], [lap.length, 'Report masuk', 'info'],
    [fmtM(lap.reduce((t, x) => t + Number(x.panjang_kabel || 0), 0)), 'Total kabel (m)', 'info']].map(([v, l, c]) => kpi(v, l, c)).join('');

  const nama = new Map(S.teknisi.map(n => [kunci(n), n]));
  [...abs, ...lap].forEach(x => { const k = kunci(x.teknisi); if (!nama.has(k)) nama.set(k, x.teknisi); });
  const rows = [...nama.entries()].map(([k, n]) => {
    const m = masuk.find(x => kunci(x.teknisi) === k), pl = pulang.find(x => kunci(x.teknisi) === k), lp = lap.filter(x => kunci(x.teknisi) === k);
    const akt = [...abs.filter(x => kunci(x.teknisi) === k).map(x => ({w:x.waktu, t:x.tipe === 'MASUK' ? 'Absen masuk' : 'Absen pulang', lat:x.lat, lng:x.lng})),
                 ...lp.map(x => ({w:x.waktu, t:`Report ${x.nama_pelanggan}`, lat:x.lat, lng:x.lng}))].sort((a, b) => b.w.localeCompare(a.w));
    return {n, m, pl, lp, last:akt[0]};
  }).sort((a, b) => (b.last ? b.last.w : '').localeCompare(a.last ? a.last.w : ''));
  isiPilihanTeknisi(rows.map(r => r.n));
  $('#mBody').innerHTML = rows.length ? rows.map(({n, m, pl, lp, last}) => `
    <tr><td><b>${esc(n)}</b></td>
      <td>${m ? `<span class="mono">${jam(m.waktu)}</span> ${pill(m.status)}` : '<span class="pill bad">Belum</span>'}</td>
      <td>${pl ? `<span class="mono">${jam(pl.waktu)}</span> ${pill(pl.status)}` : '<span class="sub">-</span>'}</td>
      <td class="num">${lp.length}</td><td class="num">${fmtM(lp.reduce((t, x) => t + Number(x.panjang_kabel || 0), 0))}</td>
      <td>${last ? `<span class="mono">${jam(last.w)}</span> ${esc(last.t)}` : '-'}</td>
      <td>${m ? esc(m.lokasi_nama) + ` <span class="sub">(${fmtJarak(m.jarak)})</span>` : '-'}</td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">Belum ada teknisi.</td></tr>';

  const feed = [...abs.map(x => ({w:x.waktu, h:`<b>${esc(x.teknisi)}</b> absen ${x.tipe === 'MASUK' ? 'masuk' : 'pulang'} di ${esc(x.lokasi_nama)} ${pill(x.status)}`})),
                ...lap.map(x => ({w:x.waktu, h:`<b>${esc(x.teknisi)}</b> report ${esc(x.nama_pelanggan)} <span class="sub mono">${esc(x.id_pelanggan)}</span> · ${esc(x.odp)} port ${esc(x.port)}`}))]
    .sort((a, b) => b.w.localeCompare(a.w)).slice(0, 40);
  $('#mFeed').innerHTML = feed.length ? feed.map(f => `<div><time>${jam(f.w)}</time><span>${f.h}</span></div>`).join('') : '<p class="empty">Belum ada aktivitas.</p>';

  if (!S.maps.mon){ S.maps.mon = petaBaru('mMap'); S.maps.monLay = L.layerGroup().addTo(S.maps.mon); }
  setTimeout(() => S.maps.mon.invalidateSize(), 50);
  const lay = S.maps.monLay; lay.clearLayers(); const c = aksen(), pts = [];
  S.lokasi.forEach(l => { L.circle([l.lat, l.lng], {radius:l.radius, color:c, weight:1.5, fillColor:c, fillOpacity:.12}).addTo(lay).bindTooltip(esc(l.nama)); pts.push([l.lat, l.lng]); });
  lap.filter(x => x.lat != null).forEach(x => {
    L.circleMarker([x.lat, x.lng], {radius:6, color:'#fff', weight:1.5, fillColor:'#14714A', fillOpacity:.95}).addTo(lay)
      .bindPopup(`<b>${esc(x.nama_pelanggan)}</b> (${esc(x.id_pelanggan)})<br>${esc(x.teknisi)} · ${jam(x.waktu)}<br>${esc(x.odp)} port ${esc(x.port)} · ${fmtM(x.panjang_kabel)} m`);
    pts.push([x.lat, x.lng]);
  });
  rows.filter(r => r.last && r.last.lat != null).forEach(r => {
    L.circleMarker([r.last.lat, r.last.lng], {radius:10, color:'#fff', weight:3, fillColor:r.pl ? WARNA.pulang : WARNA.aktif, fillOpacity:1}).addTo(lay)
      .bindTooltip(esc(r.n), {permanent:true, direction:'top', offset:[0,-8]}).bindPopup(`<b>${esc(r.n)}</b><br>Terakhir ${jam(r.last.w)}: ${esc(r.last.t)}`);
    pts.push([r.last.lat, r.last.lng]);
  });
  if (pts.length && !S.maps.monFit){ S.maps.mon.fitBounds(L.latLngBounds(pts).pad(.15), {maxZoom:16}); S.maps.monFit = true; }
}

/* =====================================================================
   LAPORAN
   ===================================================================== */
$('#lCari').addEventListener('click', muatLaporan);
$('#lCariPel').addEventListener('keydown', e => { if (e.key === 'Enter') muatLaporan(); });
async function muatLaporan(){
  const d = $('#lDari').value, s = $('#lSampai').value;
  if (!d || !s || d > s) return toast('Rentang tanggal tidak valid.', 'bad');
  let q = sb.from('laporan').select('*').gte('tanggal', d).lte('tanggal', s).order('waktu', {ascending:false}).limit(3000);
  if ($('#lTek').value) q = q.ilike('teknisi', $('#lTek').value);
  if ($('#lStasiun').value) q = q.eq('stasiun', $('#lStasiun').value);
  const {data, error} = await q; if (error) return err(error);
  const cari = $('#lCariPel').value.trim().toLowerCase();
  S.lap = cari ? data.filter(x => [x.id_pelanggan, x.nama_pelanggan, x.sn_ont, x.odc, x.odp].join(' ').toLowerCase().includes(cari)) : data;
  isiPilihanTeknisi(data.map(x => x.teknisi));
  const sv = $('#lStasiun').value, sts = [...new Set([...data.map(x => x.stasiun), ...S.lokasi.map(l => l.nama), sv].filter(Boolean))].sort();
  $('#lStasiun').innerHTML = '<option value="">Semua</option>' + sts.map(n => `<option>${esc(n)}</option>`).join(''); $('#lStasiun').value = sv;
  $('#lKpi').innerHTML = [[S.lap.length, 'Total report', 'info'], [new Set(S.lap.map(x => kunci(x.teknisi))).size, 'Teknisi', 'ok'],
    [fmtM(S.lap.reduce((t, x) => t + Number(x.panjang_kabel || 0), 0)), 'Total kabel (m)', 'info']].map(([v, l, k]) => kpi(v, l, k)).join('');
  $('#lBody').innerHTML = S.lap.length ? S.lap.map(x => `
    <tr class="click" data-lap="${x.id}"><td class="num">${esc(fWaktu.format(new Date(x.waktu)))}</td><td>${esc(x.teknisi)}</td>
    <td>${esc(x.stasiun)}</td><td>${esc(x.nama_pelanggan)}</td><td class="num">${esc(x.id_pelanggan)}</td><td class="num">${esc(x.sn_ont)}</td>
    <td class="num">${esc(x.odc)}</td><td class="num">${esc(x.odp)}</td><td class="num">${esc(x.port)}</td><td class="num">${fmtM(x.panjang_kabel)} m</td><td class="num">${x.foto_paths.length}</td></tr>`).join('')
    : '<tr><td colspan="11" class="empty">Tidak ada report pada filter ini.</td></tr>';
}
$('#lBody').addEventListener('click', e => {
  const tr = e.target.closest('[data-lap]'); if (!tr) return;
  const x = S.lap.find(l => l.id === tr.dataset.lap);
  bukaPanel(`
    <div class="row"><h2 style="font-size:17px">${esc(x.nama_pelanggan)}</h2><span class="spacer"></span><button class="btn sm" type="button" data-tutup>Tutup</button></div>
    <pre class="mono" style="margin:0;white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px">${esc(teksReport(x))}</pre>
    <div class="row"><button class="btn pri sm" type="button" data-copy>Salin teks report</button>
      <span class="sub mono">${esc(x.tanggal)} ${esc(fJamD.format(new Date(x.waktu)))} WIB${x.lat != null ? ` · <a href="${gmaps(x.lat, x.lng)}" target="_blank" rel="noopener">lokasi di peta</a>` : ''}</span></div>

$('#lCsv').addEventListener('click', () => {

});

    <p class="sub mono">${esc(x.tanggal)} ${esc(fJamD.format(new Date(x.waktu)))} · ${esc(x.lokasi_nama)} (${fmtJarak(x.jarak)}) · <a href="${gmaps(x.lat, x.lng)}" target="_blank" rel="noopener">buka peta</a></p>
    <div class="photos" style="grid-template-columns:minmax(0,360px)"><a href="${fotoUrl(x.foto_path)}" target="_blank" rel="noopener"><img src="${fotoUrl(x.foto_path)}" alt="Selfie"></a></div>`);
});
$('#aCsv').addEventListener('click', () => {

});

/* =====================================================================
   SUPER ADMIN
   ===================================================================== */
const ADM = {token:null, nama:''};
function lsGet(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }
function lsSet(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(_){} }
async function admRpc(name, params){
  const {data, error} = await sb.rpc(name, {p_token:ADM.token, ...params});
  if (error){ if (/Sesi berakhir|Hanya super admin/.test(error.message)) admKeluar(); throw error; }
  return data;
}
function admUi(){
  const on = !!ADM.token;
  $('#btnAdm').textContent = on ? 'Keluar admin' : 'Masuk super admin'; $('#btnAdm').classList.toggle('pri', !on);
  $('#admInfo').hidden = !on; $('#admInfo').textContent = on ? 'Super admin: ' + ADM.nama : '';
}
function admKeluar(){
  if (ADM.token) sb.rpc('logout', {p_token:ADM.token}).then(() => {}, () => {});
  ADM.token = null; ADM.nama = ''; lsSet('adm_token', null); admUi(); route();
}
function admLoginPanel(){
  bukaPanel(`
    <div class="row"><h2 style="font-size:17px">Masuk super admin</h2><span class="spacer"></span><button class="btn sm" type="button" data-tutup>Tutup</button></div>
    <form id="fAdm" class="stack">
      <label class="f">Username <input id="admUser" class="in" autocomplete="username" autocapitalize="none" required></label>
      <label class="f">Password <input id="admPass" class="in" type="password" autocomplete="current-password" required></label>
      <div class="row"><button class="btn pri" type="submit">Masuk</button></div>
    </form>`);
  setTimeout(() => $('#admUser').focus(), 50);
  $('#fAdm').addEventListener('submit', async e => {
    e.preventDefault();
    const {data, error} = await sb.rpc('login', {p_username:$('#admUser').value.trim(), p_password:$('#admPass').value});
    if (error) return err(error);
    if (data.role !== 'superadmin'){ sb.rpc('logout', {p_token:data.token}); return toast('Akun ini akun teknisi, bukan super admin.', 'bad'); }
    ADM.token = data.token; ADM.nama = data.nama; lsSet('adm_token', ADM.token);
    tutupPanel(); admUi(); toast('Masuk sebagai super admin.'); route();
  });
}
$('#btnAdm').addEventListener('click', () => ADM.token ? admKeluar() : admLoginPanel());
document.addEventListener('click', e => { if (e.target.closest('[data-adm-login]')) admLoginPanel(); });

/* ---------------- akun teknisi ---------------- */
let AKUN = [], akEdit = null;
async function bukaAkun(){
  $('#akKunci').hidden = !!ADM.token; $('#akIsi').hidden = !ADM.token;
  if (!ADM.token) return;
  try { AKUN = await admRpc('admin_daftar_akun', {}); } catch(e){ return err(e); }
  $('#akBody').innerHTML = AKUN.map(a => `
    <tr><td class="num">${esc(a.username)}</td><td>${esc(a.nama)}</td>
    <td>${a.role === 'superadmin' ? '<span class="pill info">Super admin</span>' : 'Teknisi'}</td>
    <td>${a.aktif ? '<span class="pill ok">Aktif</span>' : '<span class="pill idle">Nonaktif</span>'}</td>
    <td class="num">${esc(fWaktu.format(new Date(a.created_at)))}</td>
    <td><button class="btn sm" type="button" data-ak="${esc(a.username)}">Edit</button></td></tr>`).join('');
}
function resetAkun(){
  akEdit = null; ['#akUser','#akNama','#akPass'].forEach(s => $(s).value = '');
  $('#akUser').readOnly = false; $('#akRole').value = 'teknisi'; $('#akAktif').value = '1';
  $('#akTitle').textContent = 'Buat akun teknisi'; $('#akPassLbl').textContent = 'Password (min. 6 karakter)'; $('#akBatal').hidden = true;
}
$('#akBatal').addEventListener('click', resetAkun);
$('#akBody').addEventListener('click', e => {
  const b = e.target.closest('[data-ak]'); if (!b) return;
  const a = AKUN.find(x => x.username === b.dataset.ak); akEdit = a.username;
  $('#akUser').value = a.username; $('#akUser').readOnly = true; $('#akNama').value = a.nama; $('#akPass').value = '';
  $('#akRole').value = a.role; $('#akAktif').value = a.aktif ? '1' : '0';
  $('#akTitle').textContent = 'Edit ' + a.username; $('#akPassLbl').textContent = 'Password baru (kosongkan jika tidak diganti)'; $('#akBatal').hidden = false;
  $('#akNama').focus();
});
$('#akSimpan').addEventListener('click', async () => {
  const user = $('#akUser').value.trim();
  try {
    await admRpc('admin_simpan_akun', {p_username:user, p_nama:$('#akNama').value.trim(), p_password:$('#akPass').value,
      p_role:$('#akRole').value, p_aktif:$('#akAktif').value === '1'});
    toast(akEdit ? `Akun ${user} diperbarui.` : `Akun ${user} dibuat. Sudah bisa login di aplikasi teknisi.`);
    resetAkun(); await bukaAkun(); muatMaster().catch(() => {});
  } catch(e){ err(e); }
});

/* ---------------- pengaturan ---------------- */
function bukaPengaturan(){
  $('#pgKunci').hidden = !!ADM.token; $('#pgIsi').hidden = !ADM.token;
  const p = S.peng || {};
  $('#pgMasuk').value = String(p.jam_masuk || '08:00').slice(0, 5); $('#pgPulang').value = String(p.jam_pulang || '17:00').slice(0, 5);
  $('#pgTol').value = p.toleransi_menit ?? 15; $('#pgAcc').value = p.akurasi_maks ?? 100;
}
$('#pgSimpan').addEventListener('click', async () => {
  try {
    await admRpc('admin_simpan_pengaturan', {p_jam_masuk:$('#pgMasuk').value, p_jam_pulang:$('#pgPulang').value,
      p_toleransi:Number($('#pgTol').value), p_akurasi:Number($('#pgAcc').value)});
    await muatMaster(); toast('Pengaturan disimpan.');
  } catch(e){ err(e); }
});
$('#gpSimpan').addEventListener('click', async () => {
  try {
    await admRpc('ganti_password', {p_lama:$('#gpLama').value, p_baru:$('#gpBaru').value});
    $('#gpLama').value = ''; $('#gpBaru').value = ''; toast('Password super admin diganti.');
  } catch(e){ err(e); }
});

/* =====================================================================
   LOKASI
   ===================================================================== */
let loEdit = null;
function bukaLokasi(){
  if (!S.maps.lok){
    S.maps.lok = petaBaru('loMap'); S.maps.lokLay = L.layerGroup().addTo(S.maps.lok);
    S.maps.lok.on('click', e => { if (!ADM.token) return; $('#loLat').value = e.latlng.lat.toFixed(6); $('#loLng').value = e.latlng.lng.toFixed(6); draftLokasi(); });
  }
  setTimeout(() => S.maps.lok.invalidateSize(), 50);
  $('#loForm').hidden = !ADM.token; $('#loKunci').hidden = !!ADM.token;
  const c = aksen(), lay = S.maps.lokLay; lay.clearLayers();
  S.lokasi.forEach(l => L.circle([l.lat, l.lng], {radius:l.radius, color:c, weight:2, fillColor:c, fillOpacity:.15}).addTo(lay).bindTooltip(`${esc(l.nama)} · ${l.radius} m`));
  if (S.lokasi.length) S.maps.lok.fitBounds(L.featureGroup(lay.getLayers()).getBounds().pad(.3), {maxZoom:17});
  $('#loList').innerHTML = S.lokasi.length ? S.lokasi.map(l => `<div class="item"><div class="m"><b>${esc(l.nama)}</b><br><span class="sub mono">${l.lat.toFixed(6)}, ${l.lng.toFixed(6)} · radius ${l.radius} m</span></div>
      ${ADM.token ? `<button class="btn sm" type="button" data-le="${l.id}">Edit</button><button class="btn sm danger" type="button" data-ld="${l.id}">Hapus</button>` : ''}</div>`).join('')
    : '<p class="empty">Belum ada lokasi. Teknisi belum bisa absen sampai minimal satu lokasi ditambahkan.</p>';
}
['#loRad', '#loLat', '#loLng'].forEach(s => $(s).addEventListener('input', draftLokasi));
function draftLokasi(){
  if (S.draft){ S.draft.remove(); S.draft = null; }
  const lat = parseFloat($('#loLat').value), lng = parseFloat($('#loLng').value);
  if (!isFinite(lat) || !isFinite(lng)) return;
  const rad = Math.max(10, Math.min(5000, Number($('#loRad').value) || 200));
  S.draft = L.circle([lat, lng], {radius:rad, color:'#D9480F', weight:2, dashArray:'6 4', fillOpacity:.12}).addTo(S.maps.lok);
}
function resetLokasi(){
  loEdit = null; ['#loNama','#loLat','#loLng'].forEach(s => $(s).value = ''); $('#loRad').value = 200;
  $('#loTitle').textContent = 'Tambah lokasi'; $('#loBatal').hidden = true; if (S.draft){ S.draft.remove(); S.draft = null; }
}
$('#loBatal').addEventListener('click', resetLokasi);
$('#loList').addEventListener('click', async e => {
  const ed = e.target.closest('[data-le]'), del = e.target.closest('[data-ld]');
  if (ed){
    const l = S.lokasi.find(x => x.id === ed.dataset.le); loEdit = l.id;
    $('#loNama').value = l.nama; $('#loLat').value = l.lat; $('#loLng').value = l.lng; $('#loRad').value = l.radius;
    $('#loTitle').textContent = 'Edit ' + l.nama; $('#loBatal').hidden = false; draftLokasi();
  }
  if (del){
    if (del.dataset.yakin !== '1'){ del.dataset.yakin = '1'; del.textContent = 'Klik lagi untuk hapus'; return; }
    try { await admRpc('admin_hapus_lokasi', {p_id:del.dataset.ld}); await muatMaster(); resetLokasi(); bukaLokasi(); toast('Lokasi dihapus.'); } catch(x){ err(x); }
  }
});
$('#loSimpan').addEventListener('click', async () => {
  const lat = Number($('#loLat').value), lng = Number($('#loLng').value), rad = Math.round(Number($('#loRad').value));
  if (!$('#loNama').value.trim()) return toast('Isi nama lokasi.', 'bad');
  if (!$('#loLat').value || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return toast('Klik titik di peta atau isi koordinat yang benar.', 'bad');
  if (!(rad >= 10 && rad <= 5000)) return toast('Radius 10–5000 meter.', 'bad');
  try {
    await admRpc('admin_simpan_lokasi', {p_id:loEdit, p_nama:$('#loNama').value.trim(), p_lat:lat, p_lng:lng, p_radius:rad});
    await muatMaster(); resetLokasi(); bukaLokasi(); toast('Lokasi disimpan. Teknisi sudah bisa absen di sini.');
  } catch(e){ err(e); }
});

/* ---------------- panel ---------------- */
function bukaPanel(html){ $('#panel').innerHTML = html; $('#modal').hidden = false; }
function tutupPanel(){ $('#modal').hidden = true; $('#panel').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-tutup]')) tutupPanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) tutupPanel(); });

/* ---------------- mulai ---------------- */
(async function start(){
  ['#mTgl','#lDari','#lSampai','#aDari','#aSampai'].forEach(s => $(s).value = hariIni());
  const t = lsGet('adm_token');
  if (t){
    const {data, error} = await sb.rpc('sesi_info', {p_token:t});
    if (!error && data && data.role === 'superadmin'){ ADM.token = t; ADM.nama = data.nama; } else lsSet('adm_token', null);
  }
  admUi();
  try { await muatMaster(); } catch(e){ err(e); }
  route();
})();
</script>

<template id="tpl-app"><style>

}

  --ok:#6FD49F; --ok-bg:#163327; --warn:#F2B866; --warn-bg:#3A2A12; --bad:#FF8A7E; --bad-bg:#3D1914; color-scheme:dark;
}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.top{position:sticky;top:0;z-index:600;background:var(--accent);color:var(--on-accent);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}

.seg label{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:14px;cursor:pointer;background:var(--sunk)}
.seg input:checked + label{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;cursor:pointer}

.modal{position:fixed;inset:0;z-index:1000;background:rgba(5,15,12,.8);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:420px;padding:16px;display:grid;gap:12px;max-height:100%;overflow:auto}
.cam{position:relative;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;max-width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam .guide{position:absolute;inset:12% 18% 22%;border:2px dashed rgba(255,255,255,.55);border-radius:50% 50% 46% 46%;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:1100;
  width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px}
.toast.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.toast.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

<header class="top">
  <div class="top-in">
    <button id="btnBack" class="back" type="button" aria-label="Kembali" hidden>&#8592;</button>
    <h1 id="title">Teknisi IKR</h1>
    <div class="clock"><span id="clk">--:--</span><small id="clkD"></small></div>
  </div>
</header>

<main>
  <!-- LOGIN -->
  <section id="vLogin" class="view" hidden>
    <div class="card">
      <h2>Masuk teknisi</h2>
      <p class="sub">Gunakan username dan password dari admin.</p>
      <form id="fLogin" class="stack" style="margin-top:14px">
        <label class="f">Username <input id="lgUser" class="in" autocomplete="username" autocapitalize="none" required></label>
        <label class="f">Password <input id="lgPass" class="in" type="password" autocomplete="current-password" required></label>
        <button class="btn pri big" type="submit">Masuk</button>
      </form>
    </div>
  </section>

  <!-- BERANDA -->
  <section id="vBeranda" class="view" hidden>
    <div class="card">
      <div class="row">
        <div style="min-width:0;flex:1"><h2 id="bNama">-</h2><p id="bInfo" class="sub"></p></div>
        <button id="btnLogout" class="btn sm" type="button">Keluar</button>
      </div>
    </div>

    <div class="card">
      <div class="steps">
        <div id="st1" class="step">
          <div class="dot">1</div>
          <div class="step-body">
            <div class="row"><b>Absen masuk</b><span class="spacer"></span><span id="st1Pill"></span></div>
            <p id="st1Txt" class="sub"></p>
            <button id="btnMasuk" class="btn pri" type="button">Absen masuk dengan selfie</button>
          </div>
        </div>
        <div id="st2" class="step">
          <div class="dot">2</div>
          <div class="step-body">
            <div class="row"><b>Report pekerjaan</b><span class="spacer"></span><span id="st2Pill"></span></div>
            <p id="st2Txt" class="sub"></p>
            <button id="btnLapor" class="btn pri" type="button">+ Buat report</button>
          </div>
        </div>
        <div id="st3" class="step">
          <div class="dot">3</div>
          <div class="step-body">
            <div class="row"><b>Absen pulang</b><span class="spacer"></span><span id="st3Pill"></span></div>
            <p id="st3Txt" class="sub"></p>
            <button id="btnPulang" class="btn" type="button">Absen pulang dengan selfie</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row"><h3>Area absen</h3><span class="spacer"></span><span id="covPill" class="pill idle">Mencari GPS…</span></div>
      <div id="map" class="map" style="margin-top:10px"></div>

      <div id="lapList" class="list" style="margin-top:6px"></div>

  <!-- FORM REPORT -->
  <section id="vLaporan" class="view" hidden>
    <form id="fLap" class="stack">
      <div class="card stack">
        <label class="f">Nama pelanggan <input id="rNamaPel" class="in" required maxlength="150" autocomplete="off"></label>
        <label class="f">ID pelanggan <input id="rIdPel" class="in mono" required maxlength="150" autocomplete="off"></label>
        <label class="f">SN ONT <input id="rSn" class="in mono" required maxlength="150" autocomplete="off" autocapitalize="characters"></label>
        <div class="grid2">
          <label class="f">ODC <input id="rOdc" class="in mono" required maxlength="150" autocomplete="off" autocapitalize="characters"></label>

      <div class="card stack">
        <div class="row"><h3>Foto pekerjaan</h3><span class="spacer"></span><span id="lpFotoN" class="sub">0 foto</span></div>

<script type="text/plain" id="js-app">
'use strict';
const CFG = window.APP_CONFIG || {};
const TZ = 'Asia/Jakarta';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fTgl = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'});
const fJam = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const fHari = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fPendek = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, weekday:'short', day:'numeric', month:'short'});
const jamDari = iso => fJam.format(new Date(iso)).slice(0, 5);
const hariIni = () => fTgl.format(new Date());
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function jarakM(a, b, c, d){
  const R = 6371000, t = x => x*Math.PI/180, dLat = t(c-a), dLng = t(d-b);
  const h = Math.sin(dLat/2)**2 + Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtJarak = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toLocaleString('id-ID', {maximumFractionDigits:2}) + ' km';
function pillStatus(s){
  const c = s === 'Tepat Waktu' || s === 'Selesai' ? 'ok' : s === 'Terlambat' || s === 'Pulang Cepat' || s === 'Pending' ? 'warn' : s === 'Gagal' ? 'bad' : 'idle';
  return `<span class="pill ${c}">${esc(s)}</span>`;
}
let toastT;
function toast(msg, kind = 'ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + kind; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
}
function pesanError(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Tidak ada koneksi internet. Coba lagi.';
  if (/duplicate key/i.test(m)) return 'Data ini sudah tercatat hari ini.';
  return m;
}
async function busy(btn, label, fn){
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${label}`;
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
}
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(_){ return null; } }

setInterval(tick, 1000); tick();
function tick(){ const d = new Date(); $('#clk').textContent = fJam.format(d).slice(0, 5); $('#clkD').textContent = fPendek.format(d); }

const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:false}});
const S = {token:null, nama:'', lokasi:[], peng:{jam_masuk:'08:00', jam_pulang:'17:00', toleransi_menit:15, akurasi_maks:100},
           masuk:null, pulang:null, laporan:[], pos:null, posErr:null, watch:null, map:null, lay:null, me:null, meAcc:null, fitted:false,
           selfieTipe:'MASUK', selfie:null, stream:null, fotos:[]};
function lsDel(k){ try { localStorage.removeItem(k); } catch(_){} }
function rpcErr(error){ if (error && /Sesi berakhir/.test(error.message)) { keluarLokal(); } return error; }

/* ---------------- login ---------------- */
$('#fLogin').addEventListener('submit', e => {
  e.preventDefault();
  busy(e.submitter, 'Masuk…', async () => {
    const {data, error} = await sb.rpc('login', {p_username:$('#lgUser').value.trim(), p_password:$('#lgPass').value});
    if (error) return toast(pesanError(error), 'bad');
    if (data.role !== 'teknisi'){ sb.rpc('logout', {p_token:data.token}); return toast('Akun super admin dipakai di dashboard, bukan di aplikasi teknisi.', 'bad'); }
    S.token = data.token; S.nama = data.nama; S.id = data.id;
    ls('token', S.token); ls('nama', S.nama); ls('tid', S.id); $('#lgPass').value = '';
    await masuk();
  });
});
$('#btnLogout').addEventListener('click', async () => {
  const t = S.token; keluarLokal();
  if (t) sb.rpc('logout', {p_token:t}).then(() => {}, () => {});
});
function keluarLokal(){
  S.token = null; S.nama = ''; S.id = null; lsDel('token'); lsDel('nama'); lsDel('tid');
  if (location.hash !== '#login') location.hash = 'login'; else route();
}
async function masuk(){
  location.hash = 'beranda'; route();
  try { await muatAwal(); await muatHariIni(); } catch(err){ toast(pesanError(err), 'bad'); }
  if (S.watch == null) mulaiGPS();
}

/* ---------------- navigasi ---------------- */
window.addEventListener('hashchange', route);
$('#btnBack').addEventListener('click', () => history.back());
function route(){
  let v = location.hash.slice(1);
  if (!S.token) v = 'login';
  else if (v !== 'laporan') v = 'beranda';
  if (v === 'laporan' && !S.masuk){ v = 'beranda'; }
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  $('#vLogin').hidden = v !== 'login'; $('#vBeranda').hidden = v !== 'beranda'; $('#vLaporan').hidden = v !== 'laporan';
  $('#btnBack').hidden = v !== 'laporan';
  $('#title').textContent = v === 'laporan' ? 'Report Pekerjaan' : 'Teknisi IKR';
  if (v === 'beranda'){ render(); if (S.map) setTimeout(() => { S.map.invalidateSize(); gambarLokasi(); }, 60); }
  if (v === 'laporan') siapkanForm();
  window.scrollTo(0, 0);
}

/* ---------------- data ---------------- */
async function muatAwal(){
  const [l, p] = await Promise.all([sb.from('lokasi').select('*').order('nama'), sb.from('pengaturan').select('*').eq('id', 1).maybeSingle()]);
  if (l.error) throw l.error;
  S.lokasi = l.data; if (p.data) S.peng = p.data;
  $('#dlStasiun').innerHTML = S.lokasi.map(x => `<option value="${esc(x.nama)}">`).join('');
  gambarLokasi();
}
async function muatHariIni(){
  if (!S.id) return;
  const t = hariIni();
  const [a, r] = await Promise.all([
    sb.from('absensi').select('*').eq('tanggal', t).eq('teknisi_id', S.id),
    sb.from('laporan').select('*').eq('tanggal', t).eq('teknisi_id', S.id).order('waktu', {ascending:false})
  ]);
  if (a.error) throw a.error; if (r.error) throw r.error;
  S.masuk = a.data.find(x => x.tipe === 'MASUK') || null;
  S.pulang = a.data.find(x => x.tipe === 'PULANG') || null;
  S.laporan = r.data;
  render();
}

/* ---------------- teks report (untuk WhatsApp) ---------------- */
function teksReport(x){
  return [`NAMA PELANGGAN : ${x.nama_pelanggan}`, `ID PELANGGAN : ${x.id_pelanggan}`, `SN ONT : ${x.sn_ont}`, `ODC : ${x.odc}`,
          `ODP : ${x.odp}`, `PORT : ${x.port}`, `PANJANG KABEL : ${Number(x.panjang_kabel).toLocaleString('id-ID')} m`,
          `TEKNISI : ${x.teknisi}`, `STASIUN : ${x.stasiun}`].join('\n');
}
async function salin(teks){
  try { await navigator.clipboard.writeText(teks); toast('Report disalin. Tempel di WhatsApp.'); }
  catch(_){
    const t = document.createElement('textarea'); t.value = teks; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('Report disalin. Tempel di WhatsApp.'); } catch(__){ toast('Tidak bisa menyalin otomatis.', 'bad'); }
    t.remove();
  }
}

/* ---------------- beranda ---------------- */
function render(){
  if (!S.token) return;
  const p = S.peng, cov = cekCoverage(), dalam = cov.kode === 'dalam';
  const st = (id, c) => $(id).className = 'step ' + c;
  $('#bNama').textContent = S.nama;
  $('#bInfo').textContent = fHari.format(new Date());

  st('#st1', S.masuk ? 'done' : 'active');
  $('#st1Pill').innerHTML = S.masuk ? pillStatus(S.masuk.status) : '';
  $('#st1Txt').textContent = S.masuk ? `Masuk pukul ${jamDari(S.masuk.waktu)} di ${S.masuk.lokasi_nama} (${fmtJarak(S.masuk.jarak)} dari titik).`
    : `Jadwal masuk ${String(p.jam_masuk).slice(0,5)}. ` + alasan(cov);
  $('#btnMasuk').hidden = !!S.masuk; $('#btnMasuk').disabled = !dalam;

  st('#st2', !S.masuk ? 'locked' : (S.laporan.length ? 'done' : 'active'));
  $('#st2Pill').innerHTML = S.laporan.length ? `<span class="pill ok">${S.laporan.length} report</span>` : '';
  $('#st2Txt').textContent = !S.masuk ? 'Terbuka setelah absen masuk.' : S.laporan.length ? 'Buat report lagi untuk setiap pelanggan berikutnya.' : 'Kirim report setiap pekerjaan selesai, lengkap dengan foto.';
  $('#btnLapor').disabled = !S.masuk;

  st('#st3', S.pulang ? 'done' : (S.masuk ? 'active' : 'locked'));
  $('#st3Pill').innerHTML = S.pulang ? pillStatus(S.pulang.status) : '';
  $('#st3Txt').textContent = S.pulang ? `Pulang pukul ${jamDari(S.pulang.waktu)} di ${S.pulang.lokasi_nama}.`
    : !S.masuk ? 'Terbuka setelah absen masuk.' : `Jadwal pulang ${String(p.jam_pulang).slice(0,5)}. ` + alasan(cov);
  $('#btnPulang').hidden = !!S.pulang; $('#btnPulang').disabled = !S.masuk || !dalam;

  $('#lapList').innerHTML = S.laporan.length ? S.laporan.map(x => `
    <div class="item">
      <div style="min-width:0"><b>${esc(x.nama_pelanggan)}</b> <span class="sub mono">${esc(x.id_pelanggan)}</span><br><small>${esc(jamDari(x.waktu))} · ${esc(x.odp)} port ${esc(x.port)} · ${esc(x.panjang_kabel)} m</small></div>
      <div><button class="btn sm" type="button" data-salin="${x.id}">Salin</button></div>
    </div>`).join('') : '<div class="empty">Belum ada report hari ini.</div>';
}
$('#lapList').addEventListener('click', e => { const b = e.target.closest('[data-salin]'); if (b) salin(teksReport(S.laporan.find(x => x.id === b.dataset.salin))); });
$('#btnRefresh').addEventListener('click', e => busy(e.currentTarget, 'Memuat…', async () => { try { await muatAwal(); await muatHariIni(); } catch(err){ toast(pesanError(err), 'bad'); } }));
$('#btnMasuk').addEventListener('click', () => bukaSelfie('MASUK'));
$('#btnPulang').addEventListener('click', () => bukaSelfie('PULANG'));
$('#btnLapor').addEventListener('click', () => { location.hash = 'laporan'; });

/* ---------------- peta & GPS ---------------- */
function warnaAksen(){ return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0B5D51'; }
function gambarLokasi(){
  if (!S.map){
    S.map = L.map('map').setView([-6.2, 106.82], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(S.map);
    S.lay = L.layerGroup().addTo(S.map);
  }
  S.lay.clearLayers(); S.fitted = false; const c = warnaAksen();
  S.lokasi.forEach(l => L.circle([l.lat, l.lng], {radius:l.radius, color:c, weight:2, fillColor:c, fillOpacity:.15}).addTo(S.lay).bindTooltip(`${esc(l.nama)} · radius ${l.radius} m`));
  if (S.lokasi.length) S.map.fitBounds(L.featureGroup(S.lay.getLayers()).getBounds(), {padding:[20,20], maxZoom:17});
  if (S.pos) posisiKePeta();
}
function mulaiGPS(){
  if (!('geolocation' in navigator)){ S.posErr = {code:0}; renderCov(); return; }
  S.watch = navigator.geolocation.watchPosition(
    p => { S.pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}; S.posErr = null; posisiKePeta(); renderCov(); },
    e => { S.posErr = e; renderCov(); }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
}
function posisiKePeta(){
  if (!S.map || !S.pos) return;
  const ll = [S.pos.lat, S.pos.lng];
  if (!S.me){
    S.meAcc = L.circle(ll, {radius:S.pos.acc, color:'#2F6FED', weight:1, fillOpacity:.1}).addTo(S.map);
    S.me = L.circleMarker(ll, {radius:8, color:'#fff', weight:3, fillColor:'#2F6FED', fillOpacity:1}).addTo(S.map).bindTooltip('Posisi Anda');
  } else { S.me.setLatLng(ll); S.meAcc.setLatLng(ll).setRadius(S.pos.acc); }
  if (!S.fitted){ S.fitted = true; const n = terdekat(); if (n) S.map.fitBounds(L.latLngBounds([ll, [n.l.lat, n.l.lng]]).pad(.35), {maxZoom:17}); else S.map.setView(ll, 16); }
}
function terdekat(){
  if (!S.pos || !S.lokasi.length) return null;
  let best = null;
  for (const l of S.lokasi){ const d = jarakM(S.pos.lat, S.pos.lng, l.lat, l.lng); if (!best || d - l.radius < best.d - best.l.radius) best = {l, d}; }
  return best;
}
function cekCoverage(){
  if (!S.lokasi.length) return {kode:'nolok'};
  if (S.posErr) return {kode:'err', err:S.posErr};
  if (!S.pos) return {kode:'wait'};
  const n = terdekat(), maks = S.peng.akurasi_maks;
  if (S.pos.acc > maks) return {kode:'lemah', n, maks};
  return {kode: n.d <= n.l.radius ? 'dalam' : 'luar', n, maks};
}
function alasan(c){
  return {dalam:'Anda di dalam area absen.', luar:'Dekati lokasi kantor sampai masuk lingkaran.', lemah:'Tunggu akurasi GPS membaik.',
          wait:'Menunggu sinyal GPS…', err:'Aktifkan GPS dan izinkan lokasi.', nolok:'Admin belum menetapkan lokasi absen.'}[c.kode] || '';
}
function renderCov(){
  const c = cekCoverage(), pill = $('#covPill'), txt = $('#covTxt');
  const set = (k, a, b) => { pill.className = 'pill ' + k; pill.textContent = a; txt.textContent = b; };
  if (c.kode === 'nolok') set('bad', 'Belum ada lokasi', 'Admin belum menetapkan lokasi absen.');
  else if (c.kode === 'err') set('bad', 'GPS tidak aktif', c.err.code === 1 ? 'Izin lokasi ditolak. Buka Setelan HP → Aplikasi → Izin → Lokasi.' : 'Lokasi belum terbaca. Pastikan GPS menyala.');
  else if (c.kode === 'wait') set('idle', 'Mencari GPS…', 'Menunggu sinyal GPS. Di dalam gedung bisa butuh beberapa detik.');
  else {
    const t = `${fmtJarak(c.n.d)} dari ${c.n.l.nama} · radius ${c.n.l.radius} m · akurasi ±${Math.round(S.pos.acc)} m`;
    if (c.kode === 'lemah') set('warn', 'GPS lemah', `${t}. Batas akurasi ±${c.maks} m.`);
    else if (c.kode === 'dalam') set('ok', 'Di dalam area', t);
    else set('bad', 'Di luar area', t);
  }
  if (!$('#vBeranda').hidden) render(); else if (!$('#vLaporan').hidden) infoGps();
}

/* ---------------- foto ---------------- */
function bacaGambar(file){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
function toBlob(cv, q){ return new Promise(r => cv.toBlob(r, 'image/jpeg', q)); }
function capWaktu(ctx, W, H, lines){
  const s = Math.min(W, H) / 600, bandH = (22 + lines.length*24)*s, y0 = H - bandH - 30*s;
  const g = ctx.createLinearGradient(0, y0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,.82)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  lines.forEach((t, i) => { ctx.font = `${i === 0 ? 700 : 500} ${Math.round((i === 0 ? 20 : 16)*s)}px system-ui, sans-serif`; ctx.fillText(t, 18*s, H - bandH + (14 + i*24)*s, W - 36*s); });
}
async function upload(folder, blob){
  const path = `${folder}/${hariIni()}/${uid()}.jpg`;
  const {error} = await sb.storage.from('foto').upload(path, blob, {contentType:'image/jpeg'});
  if (error) throw error;
  return path;
}

/* ---------------- selfie absen ---------------- */
$('#camClose').addEventListener('click', tutupSelfie);
$('#camRetake').addEventListener('click', () => { S.selfie = null; modeCam('live'); mulaiStream(); });
$('#camShot').addEventListener('click', () => S.stream ? jepretVideo() : $('#camFile').click());
$('#camFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const img = await bacaGambar(f); S.selfie = await gambarSelfie(img, img.naturalWidth, img.naturalHeight, false); tampilSelfie(); }
  catch(_){ toast('Foto tidak bisa dibaca. Coba lagi.', 'bad'); }
});
$('#camSend').addEventListener('click', kirimAbsen);
function modeCam(m){
  const live = m === 'live';
  $('#camVideo').hidden = !live; $('#camGuide').hidden = !live; $('#camPrev').hidden = live;
  $('#camShot').hidden = !live; $('#camRetake').hidden = live; $('#camSend').hidden = live;
}
async function bukaSelfie(tipe){
  S.selfieTipe = tipe; S.selfie = null;
  $('#camTitle').textContent = tipe === 'MASUK' ? 'Selfie absen masuk' : 'Selfie absen pulang';
  $('#camModal').hidden = false; modeCam('live'); await mulaiStream();
}
async function mulaiStream(){
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:960}, height:{ideal:1280}}, audio:false});
    const v = $('#camVideo'); v.srcObject = S.stream; await v.play();
    $('#camMsg').textContent = 'Posisikan wajah di dalam bingkai, lalu ambil foto.'; $('#camShot').textContent = 'Ambil foto';
  } catch(_){
    S.stream = null; $('#camMsg').textContent = 'Kamera tidak bisa dibuka langsung. Ketuk tombol untuk memotret dengan kamera depan.'; $('#camShot').textContent = 'Buka kamera';
  }
}
function stopStream(){ if (S.stream) S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
function tutupSelfie(){ stopStream(); $('#camModal').hidden = true; }
async function jepretVideo(){ const v = $('#camVideo'); if (!v.videoWidth) return; S.selfie = await gambarSelfie(v, v.videoWidth, v.videoHeight, true); stopStream(); tampilSelfie(); }
function tampilSelfie(){ const p = $('#camPrev'); if (p.src) URL.revokeObjectURL(p.src); p.src = URL.createObjectURL(S.selfie); modeCam('prev'); $('#camMsg').textContent = 'Pastikan wajah terlihat jelas.'; }
async function gambarSelfie(src, sw, sh, mirror){
  const W = 600, H = 800, cv = $('#cv'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;
  const r = Math.max(W/sw, H/sh), dw = sw*r, dh = sh*r;
  ctx.save(); if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); } ctx.drawImage(src, (W-dw)/2, (H-dh)/2, dw, dh); ctx.restore();
  const d = new Date(), n = terdekat();
  capWaktu(ctx, W, H, [S.nama, `${S.selfieTipe} · ${fHari.format(d)} ${fJam.format(d)} WIB`,
    S.pos ? `${S.pos.lat.toFixed(6)}, ${S.pos.lng.toFixed(6)} ±${Math.round(S.pos.acc)} m` : 'Lokasi tidak terbaca',
    n ? `${n.l.nama} · ${fmtJarak(n.d)} dari titik` : ''].filter(Boolean));
  return toBlob(cv, .72);
}
async function kirimAbsen(){
  if (!S.selfie) return;
  if (cekCoverage().kode !== 'dalam'){ toast('Anda di luar area atau GPS belum akurat.', 'bad'); return; }
  await busy($('#camSend'), 'Mengirim…', async () => {
    try {
      const path = await upload('absen', S.selfie);
      const {data, error} = await sb.rpc('absen', {p_token:S.token, p_tipe:S.selfieTipe, p_lat:S.pos.lat, p_lng:S.pos.lng, p_akurasi:S.pos.acc, p_foto:path});
      if (error) throw rpcErr(error);
      tutupSelfie();
      toast(`Absen ${data.tipe === 'MASUK' ? 'masuk' : 'pulang'} tercatat ${jamDari(data.waktu)} · ${data.status}`);
      await muatHariIni();
    } catch(e){ toast(pesanError(e), 'bad'); }
  });
}

/* ---------------- report ---------------- */
function siapkanForm(){
  $('#rTek').value = S.nama;
  if (!$('#rStasiun').value){ const n = terdekat(); $('#rStasiun').value = (S.masuk && S.masuk.lokasi_nama) || (n ? n.l.nama : ''); }
  renderThumbs(); infoGps();
}
function infoGps(){ $('#lpGps').textContent = S.pos ? `Lokasi report: ${S.pos.lat.toFixed(6)}, ${S.pos.lng.toFixed(6)} (±${Math.round(S.pos.acc)} m)` : 'Menunggu GPS… report tetap bisa dikirim tanpa koordinat.'; }
$('#lpCam').addEventListener('click', () => $('#lpFileCam').click());
$('#lpGal').addEventListener('click', () => $('#lpFileGal').click());
['#lpFileCam', '#lpFileGal'].forEach(s => $(s).addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files){
    if (S.fotos.length >= 8){ toast('Maksimal 8 foto.', 'bad'); break; }
    try { const blob = await fotoKerja(f); S.fotos.push({blob, url:URL.createObjectURL(blob)}); } catch(_){ toast('Ada foto yang tidak bisa dibaca.', 'bad'); }
  }
  renderThumbs();
}));
$('#lpThumbs').addEventListener('click', e => { const b = e.target.closest('[data-hapus]'); if (!b) return; const [x] = S.fotos.splice(+b.dataset.hapus, 1); URL.revokeObjectURL(x.url); renderThumbs(); });
function renderThumbs(){
  $('#lpThumbs').innerHTML = S.fotos.map((f, i) => `<div class="thumb"><img src="${f.url}" alt="Foto ${i+1}"><button type="button" data-hapus="${i}" aria-label="Hapus foto">×</button></div>`).join('');
  $('#lpFotoN').textContent = `${S.fotos.length} foto`;
}
async function fotoKerja(file){
  const img = await bacaGambar(file);
  const r = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight)), W = Math.round(img.naturalWidth*r), H = Math.round(img.naturalHeight*r);
  const cv = $('#cv'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H; ctx.drawImage(img, 0, 0, W, H); URL.revokeObjectURL(img.src);
  const d = new Date(), idp = $('#rIdPel').value.trim(), nmp = $('#rNamaPel').value.trim();
  capWaktu(ctx, W, H, [[idp, nmp].filter(Boolean).join(' · ') || 'Report pekerjaan', `${S.nama} · ${fHari.format(d)} ${fJam.format(d)} WIB`,
    S.pos ? `${S.pos.lat.toFixed(6)}, ${S.pos.lng.toFixed(6)} ±${Math.round(S.pos.acc)} m` : 'Lokasi tidak terbaca']);
  return toBlob(cv, .72);
}
$('#fLap').addEventListener('submit', e => {
  e.preventDefault();
  const kabel = $('#rKabel').value.trim().replace(',', '.');
  if (!isFinite(Number(kabel)) || Number(kabel) < 0) return toast('Panjang kabel harus angka meter, contoh 120', 'bad');
  if (!S.fotos.length) return toast('Lampirkan minimal 1 foto.', 'bad');
  const btn = $('#lpKirim');
  busy(btn, 'Mengirim…', async () => {
    try {
      const paths = [];
      for (let i = 0; i < S.fotos.length; i++){ btn.innerHTML = `<span class="spin"></span> Mengunggah foto ${i+1}/${S.fotos.length}…`; paths.push(await upload('laporan', S.fotos[i].blob)); }
      btn.innerHTML = '<span class="spin"></span> Menyimpan…';
      const v = s => $(s).value.trim();
      const {data, error} = await sb.rpc('kirim_laporan', {
        p_token:S.token, p_nama_pelanggan:v('#rNamaPel'), p_id_pelanggan:v('#rIdPel'), p_sn_ont:v('#rSn'), p_odc:v('#rOdc'), p_odp:v('#rOdp'),
        p_port:v('#rPort'), p_panjang_kabel:Number(kabel), p_stasiun:v('#rStasiun'),
        p_lat:S.pos ? S.pos.lat : null, p_lng:S.pos ? S.pos.lng : null, p_akurasi:S.pos ? S.pos.acc : null, p_foto_paths:paths});
      if (error) throw rpcErr(error);
      S.fotos.forEach(f => URL.revokeObjectURL(f.url)); S.fotos = [];
      const stasiun = $('#rStasiun').value; $('#fLap').reset(); $('#rStasiun').value = stasiun;
      toast('Report terkirim ke dashboard. Ketuk "Salin" untuk kirim ke WhatsApp.');
      await muatHariIni(); history.back();
    } catch(err){ toast(pesanError(err), 'bad'); }
  });
});

/* ---------------- mulai ---------------- */
(async function start(){
  S.token = ls('token'); S.nama = ls('nama') || ''; S.id = ls('tid');
  if (S.token){
    const {data, error} = await sb.rpc('sesi_info', {p_token:S.token});
    if (error && /Sesi berakhir/.test(error.message)){ S.token = null; lsDel('token'); }
    else if (data){ S.nama = data.nama; S.id = data.id; ls('nama', S.nama); ls('tid', S.id); if (data.role !== 'teknisi'){ S.token = null; lsDel('token'); } }
  }
  if (S.token){ await masuk(); } else route();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token) muatHariIni().catch(() => {}); });
})();
</script>

<script>
(function(){
  var cap = window.Capacitor;
  var native = !!(cap && (typeof cap.isNativePlatform === 'function' ? cap.isNativePlatform() : true));
  var mode = (native || new URLSearchParams(location.search).get('app') === 'teknisi') ? 'app' : 'dash';
  document.title = mode === 'app' ? 'Teknisi IKR' : 'Monitoring Teknisi IKR';
  function gagal(pesan){
    document.getElementById('boot').innerHTML = '<div><b>Tidak bisa memuat aplikasi</b>' + pesan + '<br><br><button onclick="location.reload()" style="padding:10px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;font:inherit;cursor:pointer">Muat ulang</button></div>';
  }
  function muat(src){
    return new Promise(function(ok, no){
      var s = document.createElement('script'); s.src = src; s.onload = ok;
      s.onerror = function(){ no(src); }; document.head.appendChild(s);
    });
  }
  muat("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js").then(function(){ return muat("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"); }).then(function(){
    if (!window.supabase || !window.L) throw new Error('lib');
    document.getElementById('boot').remove();
    document.body.appendChild(document.getElementById('tpl-' + mode).content.cloneNode(true));
    var js = document.createElement('script');
    js.textContent = document.getElementById('js-' + mode).textContent;
    document.body.appendChild(js);
  }).catch(function(){
    gagal('Periksa koneksi internet, lalu muat ulang.');
  });
})();
</script>
