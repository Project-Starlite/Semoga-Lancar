/* Layout: sidebar navy (navigasi + akun), area kerja terang: judul halaman, kartu statistik berikon, grafik, tabel profesional. */
:root{
  --navy:#0B1B3F; --navy-2:#132A5E; --navy-3:#1B3576; --on-navy:#DCE5FA; --navy-muted:#8EA0CB;
  --electric:#2F6BFF; --electric-2:#1E55E6; --e-soft:#E8EFFF;
  --bg:#F1F4FA; --surface:#FFFFFF; --sunk:#F6F8FC; --ink:#0B1530; --muted:#5A6684; --line:#DFE5F1;
  --ok:#15803D; --ok-bg:#E3F6EA; --warn:#C2610C; --warn-bg:#FFF0DD; --bad:#C62828; --bad-bg:#FDE7E7; --violet:#7C3AED; --violet-bg:#F0E9FF;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(11,27,63,.05),0 10px 30px rgba(11,27,63,.06);
}
@media (prefers-color-scheme:dark){:root{
  --navy:#050C1F; --navy-2:#0E1B3E; --navy-3:#16295A; --on-navy:#DCE5FA; --navy-muted:#7F8FB8;
  --electric:#5B8CFF; --electric-2:#7AA2FF; --e-soft:#15244A;
  --bg:#070D1C; --surface:#0E172C; --sunk:#0A1224; --ink:#E6ECFA; --muted:#93A0BF; --line:#1D2946;
  --ok:#5BD08A; --ok-bg:#10301F; --warn:#F5AE5B; --warn-bg:#3A2610; --bad:#FF8A80; --bad-bg:#3D1414; --violet:#B69CFF; --violet-bg:#2A1D4D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono,td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* login */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.gate-art{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.gate-art::before,.gate-art::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(91,140,255,.25)}
.gate-art::before{width:520px;height:520px;right:-180px;bottom:-200px}
.gate-art::after{width:340px;height:340px;right:-90px;bottom:-110px;border-color:rgba(91,140,255,.4)}
.gate-art h1{font-size:40px;line-height:1.1;letter-spacing:-.02em;margin:24px 0 12px;max-width:12ch;text-wrap:balance}
.gate-art p{color:var(--navy-muted);max-width:42ch;margin:0}
.gate-form{display:grid;place-items:center;padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.gate-form form{width:100%;max-width:380px;display:grid;gap:14px}
.gate-form h2{margin:0;font-size:24px;letter-spacing:-.01em}
@media (max-width:860px){.gate{grid-template-columns:1fr}.gate-art{padding:32px 24px}.gate-art h1{font-size:28px}}

/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy) 0%,#0A1838 100%);color:var(--on-navy);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;
  padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--electric);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:15px;letter-spacing:.06em;color:#fff;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--navy-muted)}
.nav{display:grid;gap:3px}
.navlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-muted);padding:0 10px;margin:6px 0 2px}
.nav a{display:flex;align-items:center;gap:11px;color:var(--on-navy);text-decoration:none;padding:10px 11px;border-radius:10px;font-weight:600;white-space:nowrap;opacity:.8;transition:background .15s}
.nav a:hover{background:var(--navy-2);opacity:1}
.nav a[aria-current="page"]{background:var(--electric);color:#fff;opacity:1;box-shadow:0 6px 16px rgba(47,107,255,.35)}
.side-foot{margin-top:auto;display:grid;gap:10px;background:var(--navy-2);border-radius:14px;padding:14px}
.who{display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:10px;background:var(--navy-3);display:grid;place-items:center;font-weight:800;color:#fff}
.who b{display:block;color:#fff;font-size:13px}
.who small{color:var(--navy-muted);font-size:12px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--navy-muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#3FD68F;box-shadow:0 0 0 3px rgba(63,214,143,.2)}
.side .btn{width:100%;background:transparent;color:var(--on-navy);border-color:rgba(255,255,255,.15)}
.side .btn:hover{background:rgba(255,255,255,.06)}

main{min-width:0;padding:calc(26px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) 48px 28px}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;max-width:1480px;margin:0 auto 20px}
.pagehead h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.pagehead p{margin:3px 0 0}
.wrap{max-width:1480px;margin:0 auto;display:grid;gap:18px}
.page{display:grid;gap:18px;animation:masuk .25s ease}
@keyframes masuk{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}

@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:700;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .brand{padding:0}.mark{width:34px;height:34px}
  .nav{order:3;width:100%;display:flex;overflow-x:auto;gap:4px}
  .navlbl,.who,.side-foot .live{display:none}
  .nav a{padding:8px 11px}
  .side-foot{margin:0 0 0 auto;background:none;padding:0;display:flex;gap:6px}
  .side-foot a.btn{display:none}
  .side .btn{width:auto}
  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}

/* badge nav */
.nav .nbadge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#F5A524;color:#2B1700;font-size:12px;font-weight:800;display:grid;place-items:center}
.nav a[aria-current="page"] .nbadge{background:#fff;color:var(--electric-2)}

/* hero dashboard */

  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}

.qa{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.qa a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;text-decoration:none;font-weight:700;font-size:13px;backdrop-filter:blur(6px)}

@media (max-width:760px){.hero-d{grid-template-columns:1fr;padding:22px}.ring{width:140px;height:140px;justify-self:start}.hero-d .clk{font-size:36px}}

.kpi b.rp{font-size:clamp(21px,1.9vw,27px);letter-spacing:-.03em;overflow-wrap:anywhere}
.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis.six{grid-template-columns:1fr}}
.kpi .spark{height:36px;margin:-4px -2px 0;color:var(--electric)}
.kpi .spark svg{width:100%;height:100%;display:block;overflow:visible}
.kpi.t-ok .spark{color:var(--ok)} .kpi.t-warn .spark{color:var(--warn)} .kpi.t-v .spark{color:var(--violet)}
.kpi.t-warn{border-bottom:3px solid var(--warn)}
.kpi:hover{transform:translateY(-2px);transition:transform .2s}
.trend{font-weight:700} .trend.up{color:var(--ok)} .trend.dn{color:var(--bad)}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1250px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.g3{grid-template-columns:1fr}}
.lb{display:grid;gap:12px;margin-top:14px}
.lbr{display:grid;grid-template-columns:24px 34px minmax(0,1fr) auto;gap:10px;align-items:center}
.lbr .rk{font-family:var(--mono);font-weight:700;color:var(--muted);text-align:center}
.lbr:nth-child(1) .rk{color:#C98A00} .lbr:nth-child(2) .rk{color:#7A8699} .lbr:nth-child(3) .rk{color:#B5651D}

.lbr .vv{font-family:var(--mono);font-weight:600;font-size:13px;text-align:right}

.feed{display:grid;margin-top:8px;max-height:400px;overflow:auto}

.fi:first-child{border-top:0}
.fi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.fi .ico svg{width:17px;height:17px}
.fi b{font-size:13px} .fi small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ico.abs{background:var(--ok-bg);color:var(--ok)} .ico.rep{background:var(--e-soft);color:var(--electric)} .ico.kas{background:var(--warn-bg);color:var(--warn)}
.avchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.avchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:13px}
.avchip .avsm{width:26px;height:26px;border-radius:50%;font-size:11px}

/* finance */
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}

.pill.idle{background:var(--sunk);color:var(--muted)}
.fbig{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.steps{display:grid}

.stp:last-child{padding-bottom:0}

.sumrow .tr i{display:block;height:100%;background:var(--ok);border-radius:999px}

/* komponen */

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}

tbody tr:hover{background:var(--sunk)}
tbody tr.click{cursor:pointer}
td.wrapcell{white-space:normal;min-width:220px;max-width:360px}
.thumbsm{width:40px;height:52px;border-radius:8px;object-fit:cover;display:block;background:var(--sunk);border:1px solid var(--line)}
.count{font-size:13px;color:var(--muted);font-weight:600}

.modal{position:fixed;inset:0;z-index:1000;background:rgba(4,10,25,.55);display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(640px,100%);height:100%;overflow:auto;display:grid;align-content:start;gap:16px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
.dl dt{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.photos a{display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:1100;max-width:min(440px,calc(100% - 36px));padding:13px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.toast.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.toast.info{background:var(--e-soft);color:var(--electric-2);border:1px solid var(--electric)}
.empty{color:var(--muted);padding:14px 0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:12px 0}
.avsm{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--e-soft);color:var(--electric-2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.pwtxt{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:600;user-select:all}
.pw{position:relative;display:block}

.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:9px}

<script type="text/plain" id="js-dash">
'use strict';
const CFG = window.APP_CONFIG || {};
const TZ = 'Asia/Jakarta';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fTgl = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'});
const fJamD = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const fJam = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const fHari = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fTglId = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, day:'2-digit', month:'short', year:'numeric'});
const fPendek = new Intl.DateTimeFormat('id-ID', {timeZone:'UTC', day:'numeric', month:'short'});
const hariIni = () => fTgl.format(new Date());
const geser = (t, n) => { const d = new Date(t + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const tglLabel = t => fTglId.format(new Date(t + 'T12:00:00+07:00'));
const fmtM = v => Number(v || 0).toLocaleString('id-ID', {maximumFractionDigits:1});
const fmtJarak = m => m == null ? '-' : m < 1000 ? Math.round(m) + ' m' : (m/1000).toLocaleString('id-ID', {maximumFractionDigits:2}) + ' km';
const gmaps = (a, b) => `https://www.google.com/maps?q=${a},${b}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(_){ return null; } }
let toastT;
function toast(msg, kind = 'ok'){ const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + kind; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4500); }
function err(e){ const m = (e && e.message) || String(e); toast(/Failed to fetch|NetworkError/i.test(m) ? 'Tidak ada koneksi internet.' : m, 'bad'); }
function muatScript(src){ return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Gagal memuat ' + src)); document.head.appendChild(s); }); }

const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:false}});
const fotoUrl = p => sb.storage.from('foto').getPublicUrl(p).data.publicUrl;
const S = {token:null, me:null, stat:null, abs:[], lap:[], akun:[], lokasi:[], charts:{}, maps:{}, akEdit:null, loEdit:null, draft:null};
async function rpc(name, params){
  const {data, error} = await sb.rpc(name, {p_token:S.token, ...params});
  if (error){ if (/Sesi berakhir|Hanya Super Admin/.test(error.message)) keluar(true); throw error; }
  if (/^admin_(hapus|ubah|kasbon_proses|set_aktif|simpan_akun)/.test(name)) kabar('admin');
  return data;
}

/* ================= LOGIN ================= */
$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault(); const b = e.submitter; b.disabled = true;
  try {
    const {data, error} = await sb.rpc('login', {p_username:$('#lgUser').value.trim(), p_password:$('#lgPass').value});
    if (error) throw error;
    if (data.role !== 'superadmin'){ sb.rpc('logout', {p_token:data.token}); throw new Error('Akun ini akun teknisi. Dashboard khusus Super Admin.'); }
    S.token = data.token; ls('adm_token', S.token); $('#lgPass').value = '';
    await masuk();
  } catch(x){ err(x); } finally { b.disabled = false; }
});
function keluar(diam){
  if (S.token && !diam) sb.rpc('logout', {p_token:S.token}).then(() => {}, () => {});
  S.token = null; ls('adm_token', null); $('#shell').hidden = true; $('#gate').hidden = false; clearInterval(S.timer);
}

const kpi = (lbl, val, tone, ic, foot, spark) => `<div class="kpi ${tone}"><div class="top"><span class="lbl">${lbl}</span><span class="kic"><svg class="ic" viewBox="0 0 24 24">${ICON[ic]}</svg></span></div><b${String(val).startsWith('Rp') ? ' class="rp"' : ''}>${val}</b>${spark ? `<div class="spark">${spark}</div>` : ''}${foot ? `<span class="foot">${foot}</span>` : ''}</div>`;
function sparkSvg(vals){
  if (!vals || vals.length < 2) return '';
  const W = 200, H = 36, mx = Math.max(1, ...vals), st = W / (vals.length - 1);
  const pts = vals.map((v, i) => [i * st, H - 3 - (v / mx) * (H - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const g = 'g' + Math.random().toString(36).slice(2, 8);

    <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#${g})"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>

async function excel(nama, sheet, head, rows){

    ws['!autofilter'] = {ref:XLSX.utils.encode_range({s:{r:0, c:0}, e:{r:rows.length, c:head.length - 1}})};
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet); XLSX.writeFile(wb, nama);

async function unggahBukti(file){
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('File bukti bukan gambar.')); i.src = URL.createObjectURL(file); });
  const r = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth * r); cv.height = Math.round(img.naturalHeight * r); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .8));
  const path = `kasbon/${hariIni()}/${(crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2))}.jpg`;
  const {error} = await sb.storage.from('foto').upload(path, blob, {contentType:'image/jpeg'});
  if (error) throw new Error('Bukti gagal diunggah: ' + error.message);
  return path;
}

.av-edit{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);display:grid;place-items:center;cursor:pointer;padding:0}
.av-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tags{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.tags .pill{background:rgba(255,255,255,.12);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;box-shadow:var(--shadow)}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat b{font-family:var(--mono);font-size:26px;line-height:1.1;font-weight:600}
.stat b small{font-size:13px;color:var(--muted);font-weight:500}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar > div{height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
.week .col{display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;gap:4px;height:100%}
.week .val{font-family:var(--mono);font-size:12px;font-weight:600}
.week .track{width:100%;max-width:30px;display:flex;align-items:flex-end;height:100%}
.week .fill{width:100%;background:var(--electric);border-radius:7px 7px 3px 3px;min-height:3px}
.week .col.today .fill{background:var(--navy)}
.week .day{font-size:11px;color:var(--muted);font-weight:700}
.week .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.week .dot.on{background:var(--ok)}
details.set{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
details.set summary{padding:16px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);transition:transform .2s}
details.set[open] summary::after{transform:rotate(90deg)}
details.set .in-body{padding:0 18px 18px;display:grid;gap:12px}
.avatar{width:56px;height:56px;border-radius:16px;background:var(--electric);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}

/* finance */
.pill.idle{background:var(--sunk);color:var(--muted)}
.fhero{border-radius:20px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#2F6BFF 0%,rgba(47,107,255,0) 55%),linear-gradient(135deg,#0B1B3F,#132F6E);box-shadow:0 12px 28px rgba(11,27,63,.25);display:grid;gap:14px;position:relative;overflow:hidden}
.fhero::after{content:"";position:absolute;right:-30px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:24px solid rgba(255,255,255,.06)}
.fhero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.fhero .big{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.fgrid div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 10px;min-width:0}
.fgrid span{display:block;font-size:11px;opacity:.75;font-weight:700}
.fgrid b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.amt{font-size:24px!important;font-weight:700!important;padding:14px!important}
.qamt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qamt button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--electric-2);cursor:pointer}
.qamt button:active{background:var(--e-soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.kb{border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:6px;cursor:pointer;background:var(--surface)}
.kb + .kb{margin-top:10px}
.kb-top{display:flex;align-items:flex-start;gap:10px}
.kb-top b{font-family:var(--mono);font-size:17px;font-weight:600}
.kb-top small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.kb-top .pill{margin-left:auto}
.kb-meta{font-size:12px;color:var(--muted)}
.kb-dt{display:none;gap:10px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.kb.open .kb-dt{display:grid}
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:12px}
.stp:last-child{padding-bottom:0}
.stp::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp i{width:22px;height:22px;border-radius:50%;background:var(--sunk);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;z-index:1}
.stp.on i{background:var(--ok);border-color:var(--ok)}
.stp.no i{background:var(--bad);border-color:var(--bad)}
.stp b{font-size:14px} .stp small{display:block;color:var(--muted);font-size:12px}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px}
.bukti{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:8px}
.bukti img{width:56px;height:74px;object-fit:cover;border-radius:8px;background:var(--sunk)}

/* navigasi bawah */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(11,27,63,.06)}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bnav button{position:relative}
.bnav .dotn{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.bnav button{border:0;background:none;border-radius:12px;padding:7px 4px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="page"]{color:var(--electric);background:var(--e-soft)}

.login-wrap{min-height:calc(100vh - 80px);display:grid;place-items:center}
.login{width:100%;max-width:420px}
.login .brandbig{display:grid;justify-items:center;gap:10px;text-align:center;margin-bottom:18px}
.login .brandbig .mark{width:64px;height:64px;border-radius:18px}
.login .brandbig .mark svg{width:34px;height:34px}
.login .brandbig b{font-size:20px;letter-spacing:.04em}

.modal{position:fixed;inset:0;z-index:1000;background:rgba(4,10,25,.82);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:20px;width:100%;max-width:420px;padding:16px;display:grid;gap:12px;max-height:100%;overflow:auto}
.cam{position:relative;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;max-width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:contain;display:block}
.cam video{transform:scaleX(-1)}
.cam .guide{position:absolute;inset:16% 24% 26%;border:2px dashed rgba(255,255,255,.55);border-radius:50% 50% 46% 46%;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:1100;
  width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.toast.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<script type="text/plain" id="js-app">
'use strict';
const CFG = window.APP_CONFIG || {};
const TZ = 'Asia/Jakarta';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fTgl = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'});
const fJam = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const fHari = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fPendek = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, weekday:'short', day:'numeric', month:'short'});
const fWaktu = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const hariIni = () => fTgl.format(new Date());
const geserHari = (t, n) => { const d = new Date(t + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmtM = v => Number(v || 0).toLocaleString('id-ID', {maximumFractionDigits:1});
const fmtJarak = m => m == null ? '-' : m < 1000 ? Math.round(m) + ' m' : (m/1000).toLocaleString('id-ID', {maximumFractionDigits:2}) + ' km';
function jarakM(a, b, c, d){ const R = 6371000, t = x => x*Math.PI/180, dLat = t(c-a), dLng = t(d-b);
  const h = Math.sin(dLat/2)**2 + Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(_){ return null; } }
let toastT;

async function busy(btn, label, fn){ const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${label}`; try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; } }

const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:false}});

const S = {token:null, me:null, lokasi:[], absenHariIni:null, absensi:[], laporan:[], pos:null, posErr:null, watch:null, alamat:'', alamatAt:null,
           map:null, lay:null, mk:null, selfie:null, stream:null, fotos:[]};

async function rpc(name, params){
  const {data, error} = await sb.rpc(name, {p_token:S.token, ...params});
  if (error){ if (/Sesi berakhir/.test(error.message)) keluarLokal(); throw error; }
  const j = {kirim_laporan:'report', absen:'absen', kasbon_ajukan:'kasbon', kasbon_batal:'kasbon', ubah_foto_profil:'profil'}[name];
  if (j) kabar(j);
  return data;
}
/* LIVE: kabari dashboard seketika; terima perubahan dari Super Admin seketika */
function pasangLive(){
  if (S.live || !sb.channel) return;
  try {
    S.live = sb.channel('starlite-live', {config:{broadcast:{self:false}}})
      .on('broadcast', {event:'ubah'}, msg => { const p = (msg && msg.payload) || {}; if (p.jenis === 'admin' && S.sinkron){ clearTimeout(S.liveT); S.liveT = setTimeout(S.sinkron, 600); } })
      .subscribe();
  } catch(_){ S.live = null; }
}
function kabar(jenis){ try { if (S.live) S.live.send({type:'broadcast', event:'ubah', payload:{jenis, nama:S.me ? S.me.nama : ''}}); } catch(_){} }

/* ---------------- login ---------------- */
$('#fLogin').addEventListener('submit', e => {
  e.preventDefault();
  busy(e.submitter, 'Masuk…', async () => {
    const {data, error} = await sb.rpc('login', {p_username:$('#lgUser').value.trim(), p_password:$('#lgPass').value});
    if (error) return toast(pesan(error), 'bad');
    if (data.role !== 'teknisi'){ sb.rpc('logout', {p_token:data.token}); return toast('Akun Super Admin dipakai di dashboard, bukan di aplikasi teknisi.', 'bad'); }
    S.token = data.token; ls('st_token', S.token); $('#lgPass').value = '';
    await mulai();
  });
});
function keluarLokal(){ S.token = null; S.me = null; ls('st_token', null); location.hash = ''; tampil(); }
$('#btnLogout').addEventListener('click', () => { const t = S.token; keluarLokal(); if (t) sb.rpc('logout', {p_token:t}).then(() => {}, () => {}); });

/* ---------------- navigasi ---------------- */
const TABS = {report:'vReport', absen:'vAbsen', finance:'vFinance', akun:'vAkun'};
document.querySelectorAll('#bnav [data-tab]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));
window.addEventListener('hashchange', tampil);
function tampil(){
  const login = !S.token;
  let tab = location.hash.slice(1); if (!TABS[tab]) tab = 'report';
  $('#vLogin').hidden = !login; $('#bnav').hidden = login;
  Object.entries(TABS).forEach(([k, id]) => $('#' + id).hidden = login || k !== tab);
  document.querySelectorAll('#bnav [data-tab]').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#topSub').textContent = login ? 'Technician App' : (S.me ? S.me.nama : '');
  if (!login && tab === 'akun') muatRingkasan().catch(() => {});
  if (!login && S.me && tab === 'absen') muatAbsensi().catch(() => {});
  if (!login && S.me && tab === 'report') muatRiwayat().catch(() => {});
  if (!login && S.me && tab === 'finance'){ $('#finDot').hidden = true; muatKasbon().catch(() => {}); }
  if (!login && tab === 'absen'){ renderAbsen(); if (S.map) setTimeout(() => { S.map.invalidateSize(); petaUpdate(); }, 60); }
  window.scrollTo(0, 0);
}

/* ---------------- data ---------------- */
async function mulai(){
  try {
    S.me = await rpc('profil_saya', {});
  } catch(e){ toast(pesan(e), 'bad'); return; }
  if (S.me.role !== 'teknisi'){ keluarLokal(); return toast('Akun Super Admin dipakai di dashboard.', 'bad'); }
  isiProfil(); $('#rTek').value = S.me.nama; $('#repTgl').textContent = fPendek.format(new Date());
  tampil();
  try {
    const l = await sb.from('lokasi').select('*').order('nama');
    S.lokasi = l.data || [];
    $('#dlStasiun').innerHTML = S.lokasi.map(x => `<option value="${esc(x.nama)}">`).join('');
  } catch(_){}
  isiRekening();
  await Promise.all([muatAbsensi().catch(e => toast(pesan(e), 'bad')), muatRiwayat().catch(e => toast(pesan(e), 'bad')), muatRingkasan().catch(() => {}), muatKasbon().catch(() => {})]);
  if (S.watch == null) mulaiGPS();
}
function isiProfil(){
  const m = S.me;
  const inisial = m.nama.split(/[\s-]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  $('#avatar').innerHTML = m.foto_profil ? `<img src="${esc(fotoUrl(m.foto_profil))}" alt="Foto profil ${esc(m.nama)}">` : esc(inisial);
  $('#pNama').textContent = m.nama; $('#pUser').textContent = '@' + m.username;
  $('#pRole').textContent = m.role === 'teknisi' ? 'TEKNISI' : 'SUPER ADMIN';
  $('#pStatus').textContent = m.aktif ? 'AKTIF' : 'NONAKTIF';
  $('#sJoin').textContent = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, month:'long', year:'numeric'}).format(new Date(m.created_at));
}
async function muatRingkasan(){
  const r = await rpc('ringkasan_saya', {});
  $('#sRepHari').textContent = r.report_hari_ini;
  $('#sKabHari').innerHTML = `${fmtM(r.kabel_hari_ini)}<small> m</small>`;
  $('#sRepBln').textContent = r.report_bulan_ini;
  $('#sKabBln').innerHTML = `${fmtM(r.kabel_bulan_ini)}<small> m</small>`;
  $('#sBulan').textContent = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, month:'long', year:'numeric'}).format(new Date());
  $('#sHadir').textContent = `${r.absen_bulan_ini} / ${r.hari_bulan_ini} hari`;
  $('#sHadirBar').style.width = Math.min(100, Math.round(r.absen_bulan_ini / Math.max(1, r.hari_bulan_ini) * 100)) + '%';
  $('#sRepTot').textContent = Number(r.report_total).toLocaleString('id-ID'); $('#sKabTot').textContent = fmtM(r.kabel_total);
  $('#pAbsen').textContent = r.absen_hari_ini ? 'SUDAH ABSEN HARI INI' : 'BELUM ABSEN HARI INI';
  const max = Math.max(1, ...r.harian.map(h => h.report)), hariLbl = new Intl.DateTimeFormat('id-ID', {timeZone:'UTC', weekday:'short'});
  $('#week').innerHTML = r.harian.map((h, i) => `<div class="col${i === r.harian.length - 1 ? ' today' : ''}"><span class="val">${h.report}</span>
    <div class="track"><div class="fill" style="height:${Math.round(h.report / max * 100)}%"></div></div>
    <span class="day">${i === r.harian.length - 1 ? 'Hari ini' : hariLbl.format(new Date(h.tanggal + 'T00:00:00Z'))}</span><span class="dot${h.absen ? ' on' : ''}" title="${h.absen ? 'Absen' : 'Tidak absen'}"></span></div>`).join('');
}
$('#btnFoto').addEventListener('click', () => $('#fileFoto').click());
$('#avatar').addEventListener('click', () => $('#fileFoto').click());
$('#fileFoto').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const img = await bacaGambar(f), sisi = Math.min(img.naturalWidth, img.naturalHeight), N = 480;
    const cv = $('#cv'), ctx = cv.getContext('2d'); cv.width = N; cv.height = N;
    ctx.drawImage(img, (img.naturalWidth - sisi) / 2, (img.naturalHeight - sisi) / 2, sisi, sisi, 0, 0, N, N); URL.revokeObjectURL(img.src);
    const blob = await toBlob(cv, .8);

    await rpc('ubah_foto_profil', {p_path:path});

  } catch(err){ toast(pesan(err), 'bad'); }
});

/* ---------------- report ---------------- */
function teksReport(x){
  return [`NAMA PELANGGAN : ${x.nama_pelanggan}`, `ID PELANGGAN : ${x.id_pelanggan}`, `SN ONT : ${x.sn_ont}`, `ODC : ${x.odc}`, `ODP : ${x.odp}`,
          `PORT : ${x.port}`, `PANJANG KABEL : ${fmtM(x.panjang_kabel)} m`, `TEKNISI : ${x.teknisi}`, `STASIUN : ${x.stasiun}`].join('\n');
}
async function salin(teks){
  try { await navigator.clipboard.writeText(teks); toast('Report disalin. Tempel di WhatsApp.'); }
  catch(_){ const t = document.createElement('textarea'); t.value = teks; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('Report disalin. Tempel di WhatsApp.'); } catch(__){ toast('Tidak bisa menyalin otomatis.', 'bad'); } t.remove(); }
}
async function muatRiwayat(){

}

      <div class="dt">${esc(teksReport(x))}</div>
    </div>`).join('') : '<p class="empty">' + (q ? 'Tidak ada report yang cocok.' : 'Belum ada report.') + '</p>';
}
$('#hCari').addEventListener('input', renderRiwayat);
$('#riwList').addEventListener('click', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const x = S.laporan.find(r => r.id === it.dataset.id);

function resetForm(){
  ['#rNamaPel','#rIdPel','#rSn','#rOdc','#rOdp','#rPort','#rKabel'].forEach(s => $(s).value = '');
  S.fotos.forEach(f => URL.revokeObjectURL(f.url)); S.fotos = []; renderThumbs();
}
$('#btnReset').addEventListener('click', () => { resetForm(); toast('Form dikosongkan.'); });
$('#fRep').addEventListener('submit', e => {
  e.preventDefault();
  const ids = ['#rNamaPel','#rIdPel','#rSn','#rOdc','#rOdp','#rPort','#rKabel','#rStasiun'];
  const kosong = ids.find(s => !$(s).value.trim());
  if (kosong){ $(kosong).focus(); return toast('Semua kolom wajib diisi. Tulis "-" jika tidak ada.', 'bad'); }
  const kabel = $('#rKabel').value.trim().replace(',', '.');
  if (!isFinite(Number(kabel)) || Number(kabel) < 0){ $('#rKabel').focus(); return toast('Panjang kabel harus angka meter, contoh 120', 'bad'); }
  const btn = $('#btnSimpan');
  busy(btn, 'Menyimpan…', async () => {
    try {
      const paths = [];
      for (let i = 0; i < S.fotos.length; i++){ btn.innerHTML = `<span class="spin"></span> Foto ${i+1}/${S.fotos.length}…`; paths.push(await upload('laporan', S.fotos[i].blob)); }
      const v = s => $(s).value.trim();
      await rpc('kirim_laporan', {p_nama_pelanggan:v('#rNamaPel'), p_id_pelanggan:v('#rIdPel'), p_sn_ont:v('#rSn'), p_odc:v('#rOdc'), p_odp:v('#rOdp'),
        p_port:v('#rPort'), p_panjang_kabel:Number(kabel), p_stasiun:v('#rStasiun'),
        p_lat:S.pos ? S.pos.lat : null, p_lng:S.pos ? S.pos.lng : null, p_akurasi:S.pos ? S.pos.acc : null, p_foto_paths:paths});
      resetForm(); toast('REPORT BERHASIL DISIMPAN.'); muatRingkasan().catch(() => {});
      await muatRiwayat();
    } catch(err){ toast(pesan(err), 'bad'); }
  });
});

/* ---------------- foto ---------------- */
function bacaGambar(file){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
function toBlob(cv, q){ return new Promise(r => cv.toBlob(r, 'image/jpeg', q)); }
function cap(ctx, W, H, lines){
  const s = Math.min(W, H) / 600, bandH = (22 + lines.length*24)*s, y0 = H - bandH - 30*s;
  const g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,.82)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0); ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  lines.forEach((t, i) => { ctx.font = `${i === 0 ? 700 : 500} ${Math.round((i === 0 ? 20 : 16)*s)}px system-ui, sans-serif`; ctx.fillText(t, 18*s, H - bandH + (14 + i*24)*s, W - 36*s); });
}
async function upload(folder, blob){
  const path = `${folder}/${hariIni()}/${uid()}.jpg`;
  const {error} = await sb.storage.from('foto').upload(path, blob, {contentType:'image/jpeg'});
  if (error) throw new Error('Foto gagal diunggah: ' + error.message);
  return path;
}
$('#lpCam').addEventListener('click', () => $('#lpFileCam').click());
$('#lpGal').addEventListener('click', () => $('#lpFileGal').click());
['#lpFileCam', '#lpFileGal'].forEach(s => $(s).addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files){
    if (S.fotos.length >= 8){ toast('Maksimal 8 foto.', 'bad'); break; }
    try {
      const img = await bacaGambar(f), r = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const W = Math.round(img.naturalWidth*r), H = Math.round(img.naturalHeight*r), cv = $('#cv'), ctx = cv.getContext('2d');
      cv.width = W; cv.height = H; ctx.drawImage(img, 0, 0, W, H); URL.revokeObjectURL(img.src);
      const d = new Date();
      cap(ctx, W, H, [[$('#rIdPel').value.trim(), $('#rNamaPel').value.trim()].filter(Boolean).join(' · ') || 'Report teknisi',
        `${S.me.nama} · ${fHari.format(d)} ${fJam.format(d)} WIB`, S.pos ? `${S.pos.lat.toFixed(6)}, ${S.pos.lng.toFixed(6)}` : 'Lokasi tidak terbaca']);
      const blob = await toBlob(cv, .72); S.fotos.push({blob, url:URL.createObjectURL(blob)});
    } catch(_){ toast('Ada foto yang tidak bisa dibaca.', 'bad'); }
  }
  renderThumbs();
}));
$('#lpThumbs').addEventListener('click', e => { const b = e.target.closest('[data-hapus]'); if (!b) return; const [x] = S.fotos.splice(+b.dataset.hapus, 1); URL.revokeObjectURL(x.url); renderThumbs(); });
function renderThumbs(){
  $('#lpThumbs').innerHTML = S.fotos.map((f, i) => `<div class="thumb"><img src="${f.url}" alt="Foto ${i+1}"><button type="button" data-hapus="${i}" aria-label="Hapus foto">×</button></div>`).join('');
  $('#lpFotoN').textContent = `${S.fotos.length} foto`;
}

/* ---------------- absensi ---------------- */
async function muatAbsensi(){
  S.absensi = await rpc('absensi_saya', {});
  S.absenHariIni = S.absensi.find(a => a.tanggal === hariIni()) || null;
  renderAbsen();
}
const IC_OK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const IC_WAIT = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
function renderAbsen(){
  const a = S.absenHariIni;
  $('#hero').className = 'hero ' + (a ? 'done' : 'wait');
  $('#heroIc').innerHTML = a ? IC_OK : IC_WAIT;
  $('#heroSt').textContent = a ? 'SUDAH ABSEN' : 'BELUM ABSEN';
  const besok = fHari.format(new Date(Date.now() + 864e5));
  $('#heroMeta').innerHTML = a ? `${esc(fHari.format(new Date(a.waktu)))} · pukul ${esc(String(a.jam).slice(0, 5))} WIB<br><span style="opacity:.75">Absen berikutnya: ${esc(besok)}, mulai 00.00 WIB</span>`
    : `${esc(fHari.format(new Date()))} · absensi 1 kali per hari, kapan saja`;
  $('#absenForm').hidden = !!a;
  $('#btnAbsen').disabled = !(S.selfie && S.pos);
  $('#absList').innerHTML = S.absensi.length ? S.absensi.map(x => `
    <div class="item"><div style="min-width:0"><b>${esc(fHari.format(new Date(x.waktu)))}</b><br>
    <small>Pukul ${esc(String(x.jam).slice(0, 5))} · ${esc(x.alamat || (x.lat.toFixed(5) + ', ' + x.lng.toFixed(5)))}</small></div>
    <span class="pill ok">SUDAH ABSEN</span></div>`).join('') : '<p class="empty">Belum ada riwayat absensi.</p>';
  if (!a && !S.map && !$('#vAbsen').hidden) siapPeta();
}
function siapPeta(){
  if (S.map || !window.L) return;
  S.map = L.map('map', {zoomControl:false, attributionControl:true}).setView([-6.9, 107.6], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(S.map);
  S.lay = L.layerGroup().addTo(S.map); petaUpdate();
}
function petaUpdate(){
  if (!S.map) return;
  S.lay.clearLayers();
  S.lokasi.forEach(l => L.circle([l.lat, l.lng], {radius:l.radius, color:'#2F6BFF', weight:1.5, fillOpacity:.08}).addTo(S.lay).bindTooltip(l.nama));
  if (S.pos){
    L.circle([S.pos.lat, S.pos.lng], {radius:S.pos.acc, color:'#2F6BFF', weight:1, fillOpacity:.12}).addTo(S.lay);
    L.circleMarker([S.pos.lat, S.pos.lng], {radius:8, color:'#fff', weight:3, fillColor:'#2F6BFF', fillOpacity:1}).addTo(S.lay);
    S.map.setView([S.pos.lat, S.pos.lng], 16);
  }
}
function mulaiGPS(){
  if (!('geolocation' in navigator)){ S.posErr = {code:0}; renderGps(); return; }
  S.watch = navigator.geolocation.watchPosition(p => {
    S.pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}; S.posErr = null; renderGps(); cariAlamat();
  }, e => { S.posErr = e; renderGps(); }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
}
function renderGps(){
  const pill = $('#gpsPill');
  if (S.posErr){ pill.className = 'pill bad'; pill.textContent = 'GPS tidak aktif';
    $('#gpsKoord').textContent = S.posErr.code === 1 ? 'Izin lokasi ditolak. Buka Setelan HP → Aplikasi → Izin → Lokasi.' : 'Lokasi belum terbaca. Nyalakan GPS.'; }
  else if (S.pos){
    pill.className = 'pill ok'; pill.textContent = 'GPS aktif';
    $('#gpsKoord').textContent = `${S.pos.lat.toFixed(6)}, ${S.pos.lng.toFixed(6)}`;
    $('#gpsAcc').textContent = `±${Math.round(S.pos.acc)} m`;
    let best = null; S.lokasi.forEach(l => { const d = jarakM(S.pos.lat, S.pos.lng, l.lat, l.lng); if (!best || d < best.d) best = {l, d}; });
    $('#gpsArea').textContent = best ? `${best.l.nama} (${fmtJarak(best.d)})` : '-';
  }
  if (!$('#vAbsen').hidden){ siapPeta(); petaUpdate(); }
  $('#btnAbsen').disabled = !(S.selfie && S.pos);
}
async function cariAlamat(){
  if (S.alamatAt && jarakM(S.alamatAt.lat, S.alamatAt.lng, S.pos.lat, S.pos.lng) < 80) return;
  S.alamatAt = {lat:S.pos.lat, lng:S.pos.lng};
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${S.pos.lat}&lon=${S.pos.lng}&zoom=18&accept-language=id`, {signal:ctl.signal});
    const j = await r.json(); S.alamat = (j && j.display_name) || '';
  } catch(_){ S.alamat = ''; }
  $('#gpsAlamat').textContent = S.alamat || 'Tidak tersedia (koordinat tetap tersimpan)';
}

$('#btnSelfie').addEventListener('click', bukaSelfie);
$('#camClose').addEventListener('click', tutupSelfie);
$('#camRetake').addEventListener('click', () => { S.selfieDraft = null; modeCam('live'); mulaiStream(); });
$('#camShot').addEventListener('click', () => S.stream ? jepret() : $('#camFile').click());
$('#camFile').addEventListener('change', async e => {

});
$('#camUse').addEventListener('click', () => {
  S.selfie = S.selfieDraft; tutupSelfie();

function modeCam(m){ const live = m === 'live';
  $('#camVideo').hidden = !live; $('#camGuide').hidden = !live; $('#camPrev').hidden = live;
  $('#camShot').hidden = !live; $('#camRetake').hidden = live; $('#camUse').hidden = live; }
async function bukaSelfie(){ $('#camModal').hidden = false; modeCam('live'); await mulaiStream(); }
async function mulaiStream(){
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:1280}, height:{ideal:960}}, audio:false});
    const v = $('#camVideo'); v.srcObject = S.stream; await v.play();
    $('#camMsg').textContent = 'Posisikan wajah di dalam bingkai, lalu ambil foto.'; $('#camShot').textContent = 'Ambil foto';
  } catch(_){ S.stream = null; $('#camMsg').textContent = 'Kamera tidak bisa dibuka langsung. Ketuk tombol untuk memotret dengan kamera depan.'; $('#camShot').textContent = 'Buka kamera'; }
}
function stopStream(){ if (S.stream) S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
function tutupSelfie(){ stopStream(); $('#camModal').hidden = true; }
async function jepret(){ const v = $('#camVideo'); if (!v.videoWidth) return; S.selfieDraft = await gambarSelfie(v, v.videoWidth, v.videoHeight, true); stopStream(); preview(); }
function preview(){ const p = $('#camPrev'); if (p.src) URL.revokeObjectURL(p.src); p.src = URL.createObjectURL(S.selfieDraft); modeCam('prev'); $('#camMsg').textContent = 'Pastikan wajah terlihat jelas.'; }
async function gambarSelfie(src, sw, sh, mirror){
  // foto utuh (tidak dipotong / di-zoom), sisi terpanjang maks. 960 px
  const r = Math.min(1, 960 / Math.max(sw, sh)), W = Math.round(sw*r), H = Math.round(sh*r);
  const cv = $('#cv'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;
  ctx.save(); if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); } ctx.drawImage(src, 0, 0, W, H); ctx.restore();
  const d = new Date();
  cap(ctx, W, H, [`${S.me.nama} · @${S.me.username}`, `ABSENSI · ${fHari.format(d)} ${fJam.format(d)} WIB`,
    S.pos ? `${S.pos.lat.toFixed(6)}, ${S.pos.lng.toFixed(6)} ±${Math.round(S.pos.acc)} m` : 'Lokasi tidak terbaca']);
  return toBlob(cv, .72);
}
$('#btnAbsen').addEventListener('click', e => busy(e.currentTarget, 'Mengirim…', async () => {
  if (!S.pos) return toast('Lokasi GPS belum terbaca.', 'bad');
  if (!S.selfie) return toast('Ambil foto selfie dulu.', 'bad');
  try {

    await rpc('absen', {p_lat:S.pos.lat, p_lng:S.pos.lng, p_akurasi:S.pos.acc, p_alamat:S.alamat || null, p_foto:path});
    S.selfie = null; $('#selfiePh').innerHTML = ''; $('#btnSelfie').textContent = 'Ambil selfie';
    toast('ABSENSI BERHASIL DISIMPAN.'); muatRingkasan().catch(() => {});
    await muatAbsensi();
  } catch(err){ toast(pesan(err), 'bad'); if (/SUDAH MELAKUKAN ABSENSI/.test(err.message)) muatAbsensi().catch(() => {}); }
}));

/* ---------------- finance / kasbon ---------------- */
const fRp = n => 'Rp' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const bulanIni = () => hariIni().slice(0, 7);
const blnWib = iso => fTgl.format(new Date(iso)).slice(0, 7);
const ST_KAS = {MENUNGGU:['warn','MENUNGGU'], DISETUJUI:['e','DISETUJUI'], DITRANSFER:['ok','DITRANSFER'], DITOLAK:['bad','DITOLAK'], DIBATALKAN:['idle','DIBATALKAN']};
S.kasbon = []; S.kasFilter = ''; S.kasOpen = null;
function isiRekening(){
  if (!S.me) return;
  if (!$('#kBank').value) $('#kBank').value = S.me.bank || '';
  if (!$('#kRek').value) $('#kRek').value = S.me.no_rek || '';
  if (!$('#kAn').value) $('#kAn').value = S.me.atas_nama || S.me.nama;
}
async function muatKasbon(){
  const baru = await rpc('kasbon_saya', {});
  if (S.kasLama){
    const berubah = baru.filter(k => S.kasLama[k.id] && S.kasLama[k.id] !== k.status && k.status !== 'DIBATALKAN');
    berubah.forEach((k, i) => setTimeout(() => toast(k.status === 'DITRANSFER' ? `Kasbon ${fRp(k.nominal)} SUDAH DITRANSFER ke ${k.bank}.` : `Kasbon ${fRp(k.nominal)} ${k.status}.`, k.status === 'DITOLAK' ? 'bad' : 'ok'), i * 2500));
    if (berubah.length && location.hash !== '#finance') $('#finDot').hidden = false;
  }
  S.kasLama = Object.fromEntries(baru.map(k => [k.id, k.status]));
  S.kasbon = baru; renderKasbon();
}
function renderKasbon(){
  const K = S.kasbon, b = bulanIni(), sum = arr => arr.reduce((t, k) => t + Number(k.nominal), 0);
  $('#kBulan').textContent = new Intl.DateTimeFormat('id-ID', {timeZone:TZ, month:'long', year:'numeric'}).format(new Date());
  $('#kTotal').textContent = fRp(sum(K.filter(k => k.status === 'DITRANSFER' && blnWib(k.ditransfer_at) === b)));
  $('#kWait').textContent = fRp(sum(K.filter(k => k.status === 'MENUNGGU')));
  $('#kAcc').textContent = fRp(sum(K.filter(k => k.status === 'DISETUJUI')));
  $('#kN').textContent = K.filter(k => blnWib(k.created_at) === b && k.status !== 'DIBATALKAN').length;
  const f = S.kasFilter, rows = K.filter(k => !f || (f === 'proses' ? ['MENUNGGU','DISETUJUI'].includes(k.status) : k.status === f));
  $('#kRiwN').textContent = `${rows.length} pengajuan`;
  $('#kList').innerHTML = rows.length ? rows.map(k => {
    const [tone, lbl] = ST_KAS[k.status] || ['idle', k.status], tolak = k.status === 'DITOLAK', batal = k.status === 'DIBATALKAN';
    const step = (on, no, judul, ket) => `<div class="stp${on ? ' on' : ''}${no ? ' no' : ''}"><i>${no ? '×' : on ? '✓' : ''}</i><div><b>${judul}</b>${ket ? `<small>${ket}</small>` : ''}</div></div>`;
    return `<div class="kb${S.kasOpen === k.id ? ' open' : ''}" data-id="${k.id}">
      <div class="kb-top"><div style="min-width:0"><b>${fRp(k.nominal)}</b><small>${esc(k.keperluan)}</small></div><span class="pill ${tone}">${lbl}</span></div>
      <div class="kb-meta">Diajukan ${esc(fWaktu.format(new Date(k.created_at)))} · ${esc(k.bank)} ${esc(k.no_rek)}</div>
      <div class="kb-dt">
        <div class="steps">
          ${step(true, false, 'Diajukan', esc(fWaktu.format(new Date(k.created_at))))}
          ${batal ? step(false, true, 'Dibatalkan', esc(fWaktu.format(new Date(k.diproses_at)))) :
            tolak ? step(false, true, 'Ditolak', esc(fWaktu.format(new Date(k.diproses_at))) + ' · ' + esc(k.diproses_oleh || 'Super Admin')) :
            step(['DISETUJUI','DITRANSFER'].includes(k.status), false, 'Disetujui', k.diproses_at ? esc(fWaktu.format(new Date(k.diproses_at))) : 'menunggu Super Admin') +
            step(k.status === 'DITRANSFER', false, 'Ditransfer', k.ditransfer_at ? esc(fWaktu.format(new Date(k.ditransfer_at))) + ` · ke ${esc(k.bank)} ${esc(k.no_rek)} a.n. ${esc(k.atas_nama)}` : 'belum ditransfer')}
        </div>
        ${k.catatan ? `<div class="note"><b>Catatan Super Admin:</b> ${esc(k.catatan)}</div>` : ''}
        ${k.bukti_path ? `<a class="bukti" href="${esc(fotoUrl(k.bukti_path))}" target="_blank" rel="noopener"><img src="${esc(fotoUrl(k.bukti_path))}" alt="Bukti transfer" loading="lazy"><div><b>Bukti transfer</b><br><small class="sub">Ketuk untuk melihat</small></div></a>` : ''}
        ${k.status === 'MENUNGGU' ? `<button class="btn sm" type="button" data-batal style="color:var(--bad);justify-self:start">Batalkan pengajuan</button>` : ''}
      </div></div>`; }).join('') : `<p class="empty">${K.length ? 'Tidak ada pengajuan pada filter ini.' : 'Belum ada pengajuan kasbon.'}</p>`;
}
$('#kSeg').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; S.kasFilter = b.dataset.f;
  document.querySelectorAll('#kSeg [data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderKasbon(); });
$('#kList').addEventListener('click', async e => {
  const it = e.target.closest('.kb'); if (!it || e.target.closest('a')) return;
  const bt = e.target.closest('[data-batal]');
  if (bt){
    if (bt.dataset.yakin !== '1'){ bt.dataset.yakin = '1'; bt.textContent = 'Ketuk lagi untuk membatalkan'; return; }

    return;
  }
  S.kasOpen = S.kasOpen === it.dataset.id ? null : it.dataset.id; it.classList.toggle('open');
});
const angka = v => Number(String(v).replace(/[^0-9]/g, '')) || 0;
$('#kNom').addEventListener('input', e => { const n = angka(e.target.value); e.target.value = n ? n.toLocaleString('id-ID') : ''; });
document.querySelectorAll('.qamt [data-n]').forEach(b => b.addEventListener('click', () => { $('#kNom').value = Number(b.dataset.n).toLocaleString('id-ID'); }));
$('#fKas').addEventListener('submit', e => {
  e.preventDefault();
  const nom = angka($('#kNom').value), v = s => $(s).value.trim();
  if (nom < 1000){ $('#kNom').focus(); return toast('Isi nominal kasbon (minimal Rp1.000).', 'bad'); }

  busy($('#btnKas'), 'Mengirim…', async () => {
    try {
      await rpc('kasbon_ajukan', {p_nominal:nom, p_keperluan:v('#kKep'), p_bank:v('#kBank'), p_no_rek:v('#kRek'), p_atas_nama:v('#kAn')});
      Object.assign(S.me, {bank:v('#kBank'), no_rek:v('#kRek').replace(/[^0-9A-Za-z]/g, ''), atas_nama:v('#kAn')});
      $('#kNom').value = ''; $('#kKep').value = '';
      toast(`KASBON ${fRp(nom)} BERHASIL DIAJUKAN.`); await muatKasbon();
    } catch(err){ toast(pesan(err), 'bad'); }
  });
});

<script>
(function(){
  var LIB = {"supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js", "leaflet": "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js", "chart": "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"};
  var cap = window.Capacitor;
  var native = !!(cap && (typeof cap.isNativePlatform === 'function' ? cap.isNativePlatform() : true));
  var mode = window.__MODE || ((native || new URLSearchParams(location.search).get('app') === 'teknisi') ? 'app' : 'dash');
  document.title = mode === 'app' ? 'STARLITE Technician' : 'STARLITE Super Admin';
  function muat(src){
    return new Promise(function(ok, no){
      var s = document.createElement('script'); s.src = src; s.onload = ok;
      s.onerror = function(){ no(src); }; document.head.appendChild(s);
    });
  }
  var daftar = [window.supabase ? null : LIB.supabase, LIB.leaflet].concat(mode === 'dash' ? [LIB.chart] : []).filter(Boolean);
  daftar.reduce(function(p, src){ return p.then(function(){ return src === LIB.supabase ? muat(src) : muat(src).catch(function(){}); }); }, Promise.resolve()).then(function(){
    if (!window.supabase) throw new Error('lib');
    document.getElementById('boot').remove();
    document.body.appendChild(document.getElementById('tpl-' + mode).content.cloneNode(true));
    var js = document.createElement('script');
    js.textContent = document.getElementById('js-' + mode).textContent;
    document.body.appendChild(js);
    cekVersi();
  }).catch(function(){
    document.getElementById('boot').innerHTML = '<div><b>Tidak bisa memuat aplikasi</b>Periksa koneksi internet, lalu muat ulang.<br><br><button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#2F6BFF;color:#fff;font:inherit;font-weight:700;cursor:pointer">Muat ulang</button></div>';
  });
  // ---- update otomatis: cek index.html terbaru di GitHub Pages; APK & dashboard ikut memakai versi baru ----
  function cekVersi(){
    if (!/^https:$/.test(location.protocol) || /^(localhost|127\.)/.test(location.hostname)) return;
    var kini = (document.querySelector('meta[name="starlite-build"]') || {}).content, terakhir = 0, banner = null;
    function periksa(){
      if (document.visibilityState !== 'visible' || Date.now() - terakhir < 120000) return;
      terakhir = Date.now();
      fetch(location.pathname + '?cek=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
        var m = t.match(/name="starlite-build" content="(\d+)"/);
        if (!m || !kini || m[1] === kini || banner) return;
        banner = document.createElement('div');
        banner.setAttribute('role', 'status');
        banner.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);width:max-content;top:calc(12px + env(safe-area-inset-top,0px));z-index:2000;background:#0B1B3F;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font:600 14px/1.4 system-ui,sans-serif;max-width:calc(100% - 24px)';
        banner.innerHTML = '<span>Versi baru aplikasi tersedia</span><button type="button" style="border:0;border-radius:10px;background:#2F6BFF;color:#fff;font:inherit;font-weight:800;padding:8px 14px;cursor:pointer">Perbarui</button>';
        banner.querySelector('button').onclick = function(){ location.reload(); };
        document.body.appendChild(banner);
      }).catch(function(){});
    }
    document.addEventListener('visibilitychange', periksa);
    setInterval(periksa, 300000);
    setTimeout(periksa, 15000);
  }
})();
</script>
